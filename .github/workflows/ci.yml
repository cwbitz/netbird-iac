---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ci/ansible-ci.cfg
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install the pinned toolchain (.tool-versions)
        uses: jdx/mise-action@v4
      - name: Install Galaxy collections (make install)
        run: make install
      - name: Install lint tooling
        run: python -m pip install -r ci/requirements.txt
      - name: Show the running ansible-core version
        run: ansible --version
      - name: ansible-lint
        run: ansible-lint playbooks/site.yml playbooks/tenant.yml playbooks/bootstrap.yml playbooks/backup.yml playbooks/restore.yml
      - name: Playbook syntax check
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/tenant.yml
          ansible-playbook --syntax-check playbooks/bootstrap.yml
          ansible-playbook --syntax-check playbooks/backup.yml
          ansible-playbook --syntax-check playbooks/restore.yml
