---
# ==============================================================================
# Task: Deploy the self-hosted NetBird server
# (roles/netbird_server/tasks/main.yml)
# ==============================================================================
# Deploys the current combined NetBird server container (Management + Signal +
# Relay + STUN) with an embedded Dex IdP, the dashboard, and a built-in Traefik
# reverse proxy that issues Let's Encrypt certificates via the TLS-ALPN
# challenge. Mirrors the layout produced by the upstream getting-started.sh
# quickstart script, but idempotently and version-controlled.

# ------------------------------------------------------------------------------
# Preflight (advisory / required checks)
# ------------------------------------------------------------------------------
- name: "[NetBird] Assert the required inputs are set"
  tags: [netbird, netbird_preflight]
  ansible.builtin.assert:
    that:
      - domain_name is defined and (domain_name | string | trim) | length > 0
      - domain_name != 'netbird.example.com'
      - domain_name is not match('^https?://')
      - letsencrypt_email is defined and (letsencrypt_email | string | trim) | length > 0
    fail_msg: >-
      Set domain_name (an FQDN whose A record points at this host, without a
      scheme) and letsencrypt_email in
      inventory/host_vars/<hostname>/main.yml / vault.yml. See
      inventory/host_vars/example/.
  run_once: true
  delegate_to: localhost
  become: false

- name: "[NetBird] Check Docker Engine and the Compose v2 plugin on the host"
  tags: [netbird, netbird_preflight]
  ansible.builtin.command: docker compose version
  register: compose_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: "[NetBird] Fail early if Docker Engine + Compose v2 are missing"
  tags: [netbird, netbird_preflight]
  ansible.builtin.assert:
    that:
      - compose_check.rc == 0
    fail_msg: >-
      Docker Engine with the Compose v2 plugin is required on
      {{ inventory_hostname }} but was not found. Install Docker from
      https://docs.docker.com/engine/install/ and re-run; this project never
      installs Docker itself.
  when: not ansible_check_mode

- name: "[NetBird] Resolve the public domain from the control node (advisory)"
  tags: [netbird, netbird_preflight]
  ansible.builtin.command: "getent hosts {{ domain_name }}"
  register: dns_check
  changed_when: false
  failed_when: false
  run_once: true
  delegate_to: localhost
  become: false

- name: "[NetBird] Warn when the domain does not resolve"
  tags: [netbird, netbird_preflight]
  ansible.builtin.debug:
    msg: >-
      WARNING: '{{ domain_name }}' does not resolve from the control node.
      Point its A record at this host and open TCP 80/443 and UDP 3478 before
      TLS issuance and client connections can succeed.
  when: dns_check.rc | default(1) != 0

# ------------------------------------------------------------------------------
# Per-host secrets (idempotent) via the shared helper. Generates the crypto
# material the combined server needs and persists it in the encrypted per-host
# vault file (inventory/host_vars/<hostname>/vault_managed.yml):
#   vault_relay_auth_secret
#   vault_datastore_encryption_key
#   vault_session_cookie_encryption_key
# Existing non-empty secrets are preserved (never rotated).
# ------------------------------------------------------------------------------
- name: "[NetBird] Provision per-host secrets in the encrypted vault"
  tags: [netbird]
  ansible.builtin.include_role:
    name: helpers
    tasks_from: vault_secrets_dispatch
  vars:
    vault_secrets_component: "netbird_server"
    vault_secrets_vault_file: "vault_managed.yml"
    vault_secrets_list:
      - var: "vault_relay_auth_secret"
        type: "base64"
        length: 32
      - var: "vault_datastore_encryption_key"
        type: "base64"
        length: 32
      - var: "vault_session_cookie_encryption_key"
        type: "base64"
        length: 32

# ------------------------------------------------------------------------------
# Render the stack
# ------------------------------------------------------------------------------
- name: "[NetBird] Ensure the stack directory exists"
  tags: [netbird, netbird_config]
  ansible.builtin.file:
    path: "{{ stack_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[NetBird] Render config.yaml (combined server)"
  tags: [netbird, netbird_config]
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ stack_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: "[NetBird] Restart the stack"

- name: "[NetBird] Render dashboard.env"
  tags: [netbird, netbird_config]
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: "{{ stack_dir }}/dashboard.env"
    owner: root
    group: root
    mode: "0600"
  notify: "[NetBird] Restart the stack"

- name: "[NetBird] Render docker-compose.yml"
  tags: [netbird, netbird_config]
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"

# ------------------------------------------------------------------------------
# Deploy
# ------------------------------------------------------------------------------
- name: "[NetBird] Deploy the NetBird server stack"
  tags: [netbird, netbird_deploy]
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    state: present
    remove_orphans: true

# ------------------------------------------------------------------------------
# Readiness: wait for the embedded IdP discovery endpoint to answer over the
# public TLS endpoint (this also drives Let's Encrypt certificate issuance).
# ------------------------------------------------------------------------------
- name: "[NetBird] Wait for the server to answer over TLS"
  tags: [netbird, netbird_deploy]
  ansible.builtin.uri:
    url: "https://{{ domain_name }}/oauth2/.well-known/openid-configuration"
    validate_certs: true
    status_code: 200
  register: ready
  until: ready is succeeded
  retries: 60
  delay: 5
  changed_when: false
  when: not ansible_check_mode

# ------------------------------------------------------------------------------
# First-owner + tenant-credential bootstrap (fixed flow). /api/setup is
# unauthenticated and only works while no account exists; on later runs it is
# skipped. When it runs (owner_email set and setup still required):
#   1. create the first owner (password from vault, else generated);
#   2. request a short-lived owner access token (create_pat, 7 days);
#   3. create the 'admin' service user and a Personal Access Token for it;
#   4. persist that token as vault_admin_service_user_access_token in
#      vault_managed.yml;
#   5. delete the owner access token again.
# With no owner email the owner is onboarded manually at /setup and no token
# bootstrap happens. NOTE: the service-user token expires (NetBird PAT max 365
# days) and cannot be renewed once invalid; on expiry recreate it from the
# Dashboard (the tenant run fails with instructions) — see AGENTS.md.
#
# Owner password: when owner_email is set and the password is empty, a
# password is generated and persisted in vault_managed.yml. Set
# vault_owner_password in vault.yml to choose your own.
# ------------------------------------------------------------------------------
- name: "[NetBird] Provision an owner password (email set, no password supplied)"
  tags: [netbird, netbird_owner]
  ansible.builtin.include_role:
    name: helpers
    tasks_from: vault_secrets_dispatch
  vars:
    vault_secrets_component: "netbird_owner"
    vault_secrets_vault_file: "vault_managed.yml"
    vault_secrets_list:
      - var: "vault_owner_password"
        type: "base64"
        length: 24
  when: owner_email | default('') | length > 0

- name: "[NetBird] Notice: the first owner must be onboarded manually"
  tags: [netbird, netbird_owner]
  ansible.builtin.debug:
    msg: >-
      owner_email is empty, so the first owner is NOT created
      automatically and no tenant API token is provisioned. Open
      https://{{ domain_name }}/setup in a browser (that page only works while
      the instance has no accounts), then create an 'admin' service user and an
      Access Token under Team -> Service Users and set
      vault_admin_service_user_access_token in vault.yml.
  when:
    - owner_email | default('') | length == 0

- name: "[NetBird] Warn that a supplied owner password has no effect without an owner email"
  tags: [netbird, netbird_owner]
  ansible.builtin.debug:
    msg: >-
      owner_password is set but owner_email is empty, so the
      first owner is NOT created automatically and this password is not applied.
      Set owner_email, or onboard manually at
      https://{{ domain_name }}/setup.
  when:
    - owner_email | default('') | length == 0
    - owner_password | default('') | length > 0

- name: "[NetBird] Check whether instance setup is still required"
  tags: [netbird, netbird_owner]
  ansible.builtin.uri:
    url: "https://{{ domain_name }}/api/instance"
    validate_certs: true
    return_content: true
  register: instance
  failed_when: false
  changed_when: false
  when:
    - not ansible_check_mode
    - owner_email | default('') | length > 0

- name: "[NetBird] Create the first owner user via the setup API"
  tags: [netbird, netbird_owner]
  ansible.builtin.uri:
    url: "https://{{ domain_name }}/api/setup"
    method: POST
    body_format: json
    validate_certs: true
    return_content: true
    status_code: [200]
    body:
      email: "{{ owner_email }}"
      name: "{{ owner_name | default(owner_email.split('@') | first) }}"
      password: "{{ owner_password }}"
      create_pat: true
      pat_expire_in: 7
  register: setup_result
  no_log: true
  changed_when: true
  when:
    - not ansible_check_mode
    - owner_email | default('') | length > 0
    - owner_password | default('') | length > 0
    - instance is defined
    - instance.json is defined
    - instance.json.setup_required | default(false) | bool

- name: "[NetBird] Record the one-time owner access token"
  tags: [netbird, netbird_owner]
  ansible.builtin.set_fact:
    owner_access_token: "{{ setup_result.json.personal_access_token | default('') }}"
  no_log: true
  when:
    - setup_result is defined
    - setup_result.json is defined
    - setup_result.json.personal_access_token is defined

- name: "[NetBird] Bootstrap the tenant service-user access token"
  tags: [netbird, netbird_owner]
  when: owner_access_token | default('') | length > 0
  block:
    - name: "[NetBird] Look up existing service users"
      ansible.builtin.uri:
        url: "https://{{ domain_name }}/api/users?service_user=true"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Token {{ owner_access_token }}"
        validate_certs: true
        return_content: true
        status_code: [200]
      register: service_users
      no_log: true

    - name: "[NetBird] Resolve an existing 'admin' service user id"
      ansible.builtin.set_fact:
        admin_service_user_id: >-
          {{ (service_users.json | default([]))
             | selectattr('name', 'equalto', 'admin')
             | map(attribute='id') | list | first | default('') }}
      no_log: true

    - name: "[NetBird] Create the 'admin' service user"
      ansible.builtin.uri:
        url: "https://{{ domain_name }}/api/users"
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          Authorization: "Token {{ owner_access_token }}"
        body_format: json
        body:
          name: "admin"
          role: "admin"
          auto_groups: []
          is_service_user: true
        validate_certs: true
        return_content: true
        status_code: [200]
      register: admin_service_user_created
      no_log: true
      changed_when: true
      when: admin_service_user_id | length == 0

    - name: "[NetBird] Record the created 'admin' service user id"
      ansible.builtin.set_fact:
        admin_service_user_id: "{{ admin_service_user_created.json.id }}"
      no_log: true
      when: admin_service_user_created is defined

    - name: "[NetBird] Create the service-user access token"
      ansible.builtin.uri:
        url: "https://{{ domain_name }}/api/users/{{ admin_service_user_id }}/tokens"
        method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
          Authorization: "Token {{ owner_access_token }}"
        body_format: json
        body:
          name: "netbird-iac"
          expires_in: "{{ admin_service_user_access_token_expire_in | int }}"
        validate_certs: true
        return_content: true
        status_code: [200]
      register: admin_service_user_token
      no_log: true
      changed_when: true

    - name: "[NetBird] Persist the service-user access token in the vault"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_secrets_persist
      vars:
        vault_secrets_persist_vault_file: "vault_managed.yml"
        vault_secrets_persist_name: "vault_admin_service_user_access_token"
        vault_secrets_persist_value: "{{ admin_service_user_token.json.plain_token }}"

    - name: "[NetBird] List the owner's access tokens"
      ansible.builtin.uri:
        url: "https://{{ domain_name }}/api/users/{{ setup_result.json.user_id }}/tokens"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Token {{ owner_access_token }}"
        validate_certs: true
        return_content: true
        status_code: [200]
      register: owner_tokens
      no_log: true

    - name: "[NetBird] Delete the one-time owner access token"
      ansible.builtin.uri:
        url: >-
          https://{{ domain_name }}/api/users/{{ setup_result.json.user_id }}/tokens/{{ item.id }}
        method: DELETE
        headers:
          Accept: application/json
          Authorization: "Token {{ owner_access_token }}"
        validate_certs: true
        status_code: [200, 404]
      loop: >-
        {{ (owner_tokens.json | default([]))
           | selectattr('name', 'equalto', 'setup-token') | list }}
      loop_control:
        label: "{{ item.name | default(item.id) }}"
      no_log: true
      changed_when: true
