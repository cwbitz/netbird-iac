---
# ==============================================================================
# Handlers (roles/netbird_server/handlers/main.yml)
# ==============================================================================
# Restart the stack after a config re-render: docker compose does not recreate a
# container when only a bind-mounted file's content changes.
- name: "[NetBird] Restart the stack"
  tags: [netbird, netbird_deploy]
  community.docker.docker_compose_v2:
    project_src: "{{ stack_dir }}"
    state: restarted
  when: not ansible_check_mode
