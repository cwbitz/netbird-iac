---
# ==============================================================================
# Role defaults (roles/netbird_server/defaults/main.yml)
# ==============================================================================
# Container tags are pinned here and kept current by Renovate (see the
# "# renovate:" annotation above each var).

# --- Container images --------------------------------------------------------
server_image: "netbirdio/netbird-server"
# renovate: datasource=docker depName=netbirdio/netbird-server
server_version: "0.79.0"

dashboard_image: "netbirdio/dashboard"
# Upstream only ships moving dashboard tags (latest / sha-* / pr-*), so there is
# no immutable version to pin; Renovate cannot track it.
dashboard_version: "latest"

traefik_image: "traefik"
# renovate: datasource=docker depName=traefik
traefik_version: "v3.7.13"

# --- Network -----------------------------------------------------------------
network_name: "netbird"
network_subnet: "172.30.0.0/24"
network_gateway: "172.30.0.1"
traefik_ip: "172.30.0.10"

# --- Volumes -----------------------------------------------------------------
# Explicit names keep the volumes stable regardless of the compose project dir.
netbird_data_volume: "netbird_data"
netbird_traefik_certs_volume: "netbird_traefik_letsencrypt"

# --- Ports / endpoint --------------------------------------------------------
http_protocol: "https"
exposed_port: 443
stun_port: 3478

# --- Server behaviour --------------------------------------------------------
log_level: "info"

# Skip the GeoLite2 database download at startup. The download needs outbound
# access to pkgs.netbird.io and blocks startup until it finishes; set true on
# air-gapped/network-restricted hosts (disables geo-based posture checks).
disable_geolite_update: false

# Extra management addresses trusted as a reverse proxy (external proxy setups).
# The built-in Traefik is covered by traefik_ip. Example: ["203.0.113.20/32"].
trusted_peers: []

# Lifetime (days) of the 'admin' service-user PAT minted by the first-owner
# bootstrap. NetBird caps PATs at 365 days; recreate it from the Dashboard when
# it expires (the tenant run reports it).
admin_service_user_access_token_expire_in: 365
