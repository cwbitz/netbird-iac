---
# ==============================================================================
# Generate missing per-host secrets and merge them into the encrypted vault
# (roles/helpers/tasks/vault_secrets_generate.yml)
#
# Internal helper, invoked once per host by vault_secrets_dispatch.yml. Merges
# new values into inventory/host_vars/<host>/<vault_secrets_vault_file> without
# touching existing keys or the user-maintained vault.yml.
# ==============================================================================

- name: "[VaultSecrets] Select missing secret definitions for target host"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.set_fact:
    vault_secrets_missing_for_host: >-
      {%- set ns = namespace(missing=[]) -%}
      {%- for item in vault_secrets_list -%}
      {%-   set value = hostvars[target_host].get(item.var) -%}
      {%-   if (value is none) or ((value | string | trim) | length == 0) -%}
      {%-     set ns.missing = ns.missing + [item] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.missing }}
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultSecrets] Generate and persist secrets for target host"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  when: vault_secrets_missing_for_host | length > 0
  delegate_to: localhost
  become: false
  block:
    - name: "[VaultSecrets] Ensure per-host inventory vars directory exists"
      ansible.builtin.file:
        path: "{{ inventory_dir }}/host_vars/{{ target_host }}"
        state: directory
        mode: "0700"

    - name: "[VaultSecrets] Generate missing secrets for target host"
      ansible.builtin.command: "openssl rand -{{ item.type }} {{ item.length | int }}"
      register: vault_secret_gen
      changed_when: false
      no_log: true
      loop: "{{ vault_secrets_missing_for_host }}"

    - name: "[VaultSecrets] Collect generated secret values"
      ansible.builtin.set_fact:
        vault_secret_generated: >-
          {{ dict(vault_secret_gen.results
            | map(attribute='item') | map(attribute='var') | list
            | zip(vault_secret_gen.results
            | map(attribute='stdout') | list) | list) }}
      no_log: true

    - name: "[VaultSecrets] Stat the existing generated vault file"
      ansible.builtin.stat:
        path: "{{ inventory_dir }}/host_vars/{{ target_host }}/{{ vault_secrets_vault_file }}"
      register: vault_secrets_existing_stat
      no_log: true

    - name: "[VaultSecrets] Slurp the existing generated vault file"
      ansible.builtin.slurp:
        src: "{{ inventory_dir }}/host_vars/{{ target_host }}/{{ vault_secrets_vault_file }}"
      register: vault_secrets_existing_raw
      when: vault_secrets_existing_stat.stat.exists | default(false)
      no_log: true

    - name: "[VaultSecrets] Decrypt the existing generated vault file"
      ansible.builtin.command: >-
        ansible-vault view
        --vault-password-file {{ lookup('ansible.builtin.env', 'HOME') }}/.config/projects/netbird-iac/ansible_vault_password
        {{ inventory_dir }}/host_vars/{{ target_host }}/{{ vault_secrets_vault_file }}
      register: vault_secrets_existing_view
      changed_when: false
      no_log: true
      when:
        - vault_secrets_existing_stat.stat.exists | default(false)
        - "'$ANSIBLE_VAULT' in (vault_secrets_existing_raw.content | default('') | b64decode)"

    - name: "[VaultSecrets] Load existing keys (encrypted file)"
      ansible.builtin.set_fact:
        vault_secrets_existing: "{{ vault_secrets_existing_view.stdout | default('{}') | from_yaml }}"
      no_log: true
      when:
        - vault_secrets_existing_stat.stat.exists | default(false)
        - "'$ANSIBLE_VAULT' in (vault_secrets_existing_raw.content | default('') | b64decode)"

    - name: "[VaultSecrets] Load existing keys (plaintext file)"
      ansible.builtin.set_fact:
        vault_secrets_existing: "{{ (vault_secrets_existing_raw.content | default('') | b64decode) | from_yaml }}"
      no_log: true
      when:
        - vault_secrets_existing_stat.stat.exists | default(false)
        - "'$ANSIBLE_VAULT' not in (vault_secrets_existing_raw.content | default('') | b64decode)"

    - name: "[VaultSecrets] Merge existing keys with newly generated secrets"
      ansible.builtin.set_fact:
        vault_secrets_merged: >-
          {{ (vault_secrets_existing | default({})) | combine(vault_secret_generated) }}
      no_log: true

    - name: "[VaultSecrets] Write temporary plaintext secrets file"
      ansible.builtin.copy:
        dest: "/tmp/{{ vault_secrets_vault_file | replace('.yml', '') }}_{{ target_host }}.yml"
        content: "{{ vault_secrets_merged | to_nice_yaml }}"
        mode: "0600"
      no_log: true

    - name: "[VaultSecrets] Encrypt secrets into per-host vault file"
      ansible.builtin.command: >-
        ansible-vault encrypt
        --encrypt-vault-id default
        --vault-password-file {{ lookup('ansible.builtin.env', 'HOME') }}/.config/projects/netbird-iac/ansible_vault_password
        --output {{ inventory_dir }}/host_vars/{{ target_host }}/{{ vault_secrets_vault_file }}
        /tmp/{{ vault_secrets_vault_file | replace('.yml', '') }}_{{ target_host }}.yml
      changed_when: true
      no_log: true
  always:
    - name: "[VaultSecrets] Clean up temporary plaintext secrets file"
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "/tmp/{{ vault_secrets_vault_file | replace('.yml', '') }}_{{ target_host }}.yml"
        state: absent
      no_log: true
