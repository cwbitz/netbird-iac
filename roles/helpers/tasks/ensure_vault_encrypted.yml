---
# ==============================================================================
# Ensure a control-node vault file is encrypted (roles/helpers/tasks/ensure_vault_encrypted.yml)
#
# Safety net for files that should always be ansible-vault encrypted but may have
# ended up plaintext (e.g. copied back from a backup). Encrypts in place when the
# content does not start with the vault header.
#
# Parameters (via include vars):
#   ensure_vault_encrypted_file  Absolute path on the control node.
# ==============================================================================

- name: "[VaultEncrypt] Stat the target file"
  ansible.builtin.stat:
    path: "{{ ensure_vault_encrypted_file }}"
  register: vault_encrypt_stat
  delegate_to: localhost
  become: false

- name: "[VaultEncrypt] Read the target file"
  ansible.builtin.slurp:
    src: "{{ ensure_vault_encrypted_file }}"
  register: vault_encrypt_raw
  when: vault_encrypt_stat.stat.exists | default(false)
  delegate_to: localhost
  become: false

- name: "[VaultEncrypt] Encrypt the file in place when it is plaintext"
  ansible.builtin.command: >-
    ansible-vault encrypt
    --vault-password-file {{ lookup('ansible.builtin.env', 'HOME') }}/.config/projects/netbird-iac/ansible_vault_password
    {{ ensure_vault_encrypted_file }}
  changed_when: true
  when:
    - vault_encrypt_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' not in (vault_encrypt_raw.content | default('') | b64decode)[:64]"
  delegate_to: localhost
  become: false
