---
# ==============================================================================
# Remove a single key from a control-node vault file, in place and encrypted
# (roles/helpers/tasks/vault_secrets_prune.yml)
#
# Enforces disjoint key ownership between vault.yml (control-authoritative) and
# vault_managed.yml (host-authoritative). No-op when the file or key is absent.
#
# Parameters (via include vars):
#   vault_secrets_prune_file  Absolute path on the control node.
#   vault_secrets_prune_name  Variable name to remove.
# ==============================================================================

- name: "[VaultPrune] Stat the vault file"
  ansible.builtin.stat:
    path: "{{ vault_secrets_prune_file }}"
  register: vault_prune_stat
  delegate_to: localhost
  become: false

- name: "[VaultPrune] Read the vault file"
  ansible.builtin.slurp:
    src: "{{ vault_secrets_prune_file }}"
  register: vault_prune_raw
  when: vault_prune_stat.stat.exists | default(false)
  delegate_to: localhost
  become: false

- name: "[VaultPrune] Decrypt the vault file"
  ansible.builtin.command: >-
    ansible-vault view
    --vault-password-file {{ lookup('ansible.builtin.env', 'HOME') }}/.config/projects/netbird-iac/ansible_vault_password
    {{ vault_secrets_prune_file }}
  register: vault_prune_view
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  when:
    - vault_prune_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' in (vault_prune_raw.content | default('') | b64decode)"

- name: "[VaultPrune] Load keys (encrypted file)"
  ansible.builtin.set_fact:
    vault_prune_data: "{{ vault_prune_view.stdout | default('{}') | from_yaml }}"
  no_log: true
  when:
    - vault_prune_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' in (vault_prune_raw.content | default('') | b64decode)"

- name: "[VaultPrune] Load keys (plaintext file)"
  ansible.builtin.set_fact:
    vault_prune_data: "{{ (vault_prune_raw.content | default('') | b64decode) | from_yaml }}"
  no_log: true
  when:
    - vault_prune_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' not in (vault_prune_raw.content | default('') | b64decode)"

- name: "[VaultPrune] Determine whether the key is present"
  ansible.builtin.set_fact:
    vault_prune_present: >-
      {{ vault_secrets_prune_name in (vault_prune_data | default({})) }}
  no_log: true
  when: vault_prune_stat.stat.exists | default(false)

- name: "[VaultPrune] Drop the key and write the file"
  when:
    - vault_prune_stat.stat.exists | default(false)
    - vault_prune_present | default(false)
  block:
    - name: "[VaultPrune] Remove the key from the mapping"
      ansible.builtin.set_fact:
        vault_prune_updated: >-
          {{ (vault_prune_data | default({}) | dict2items
             | rejectattr('key', 'equalto', vault_secrets_prune_name) | list
             | items2dict) }}
      no_log: true

    - name: "[VaultPrune] Write the updated plaintext file"
      ansible.builtin.copy:
        dest: "{{ vault_secrets_prune_file }}"
        content: "{{ vault_prune_updated | to_nice_yaml }}"
        mode: "0600"
      no_log: true
      delegate_to: localhost
      become: false

    - name: "[VaultPrune] Re-encrypt the file"
      ansible.builtin.include_tasks: ensure_vault_encrypted.yml
      vars:
        ensure_vault_encrypted_file: "{{ vault_secrets_prune_file }}"
