---
# ==============================================================================
# Persist an externally provided secret into the encrypted per-host vault
# (roles/helpers/tasks/vault_secrets_persist.yml)
#
# Stores a value produced elsewhere (e.g. a NetBird API token), merging it in
# without touching other keys or rotating existing non-empty values.
#
# Parameters (via include vars):
#   vault_secrets_persist_vault_file  Vault filename, e.g. vault_managed.yml
#   vault_secrets_persist_name        Variable name to write
#   vault_secrets_persist_value       Value to write
#   vault_secrets_persist_prune_from  Optional sibling vault filename to remove
#                                     the same key from (disjoint ownership)
# ==============================================================================

- name: "[VaultPersist] Validate the persist contract"
  ansible.builtin.assert:
    that:
      - vault_secrets_persist_vault_file is defined and (vault_secrets_persist_vault_file | string | trim) | length > 0
      - vault_secrets_persist_vault_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - vault_secrets_persist_name is defined and vault_secrets_persist_name is regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - vault_secrets_persist_value is defined and (vault_secrets_persist_value | string | trim) | length > 0
    fail_msg: "Invalid vault_secrets_persist call."
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultPersist] Ensure per-host inventory vars directory exists"
  ansible.builtin.file:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: "[VaultPersist] Stat the existing vault file"
  ansible.builtin.stat:
    path: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_persist_vault_file }}"
  register: vault_persist_stat
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultPersist] Slurp the existing vault file"
  ansible.builtin.slurp:
    src: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_persist_vault_file }}"
  register: vault_persist_raw
  no_log: true
  delegate_to: localhost
  become: false
  when: vault_persist_stat.stat.exists | default(false)

- name: "[VaultPersist] Decrypt the existing vault file"
  ansible.builtin.command: >-
    ansible-vault view
    --vault-password-file {{ lookup('ansible.builtin.env', 'HOME') }}/.config/projects/netbird-iac/ansible_vault_password
    {{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_persist_vault_file }}
  register: vault_persist_view
  changed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  when:
    - vault_persist_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' in (vault_persist_raw.content | default('') | b64decode)"

- name: "[VaultPersist] Load existing keys (encrypted file)"
  ansible.builtin.set_fact:
    vault_persist_existing: "{{ vault_persist_view.stdout | default('{}') | from_yaml }}"
  no_log: true
  when:
    - vault_persist_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' in (vault_persist_raw.content | default('') | b64decode)"

- name: "[VaultPersist] Load existing keys (plaintext file)"
  ansible.builtin.set_fact:
    vault_persist_existing: "{{ (vault_persist_raw.content | default('') | b64decode) | from_yaml }}"
  no_log: true
  when:
    - vault_persist_stat.stat.exists | default(false)
    - "'$ANSIBLE_VAULT' not in (vault_persist_raw.content | default('') | b64decode)"

- name: "[VaultPersist] Keep existing non-empty keys"
  ansible.builtin.set_fact:
    vault_persist_merged: "{{ vault_persist_existing | default({}) }}"
  no_log: true
  when: >-
    ((vault_persist_existing | default({}))[vault_secrets_persist_name]
     | default('') | string | trim) | length > 0

- name: "[VaultPersist] Merge the provided value"
  ansible.builtin.set_fact:
    vault_persist_merged: >-
      {{ (vault_persist_existing | default({}))
         | combine({vault_secrets_persist_name: vault_secrets_persist_value}) }}
  no_log: true
  when: >-
    ((vault_persist_existing | default({}))[vault_secrets_persist_name]
     | default('') | string | trim) | length == 0

- name: "[VaultPersist] Write temporary plaintext secrets file"
  ansible.builtin.copy:
    dest: "/tmp/{{ vault_secrets_persist_vault_file | replace('.yml', '') }}_{{ inventory_hostname }}.yml"
    content: "{{ vault_persist_merged | to_nice_yaml }}"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultPersist] Encrypt the value into the per-host vault file"
  ansible.builtin.command: >-
    ansible-vault encrypt
    --encrypt-vault-id default
    --vault-password-file {{ lookup('ansible.builtin.env', 'HOME') }}/.config/projects/netbird-iac/ansible_vault_password
    --output {{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_persist_vault_file }}
    /tmp/{{ vault_secrets_persist_vault_file | replace('.yml', '') }}_{{ inventory_hostname }}.yml
  changed_when: true
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultPersist] Clean up the temporary plaintext file"
  ansible.builtin.file:
    path: "/tmp/{{ vault_secrets_persist_vault_file | replace('.yml', '') }}_{{ inventory_hostname }}.yml"
    state: absent
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultPersist] Ensure the vault file is encrypted"
  ansible.builtin.include_tasks: ensure_vault_encrypted.yml
  vars:
    ensure_vault_encrypted_file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_persist_vault_file }}"

# A key must live in exactly one vault file: drop a stale copy from the sibling.
- name: "[VaultPersist] Prune the key from the sibling vault file"
  ansible.builtin.include_tasks: vault_secrets_prune.yml
  vars:
    vault_secrets_prune_file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_persist_prune_from }}"
    vault_secrets_prune_name: "{{ vault_secrets_persist_name }}"
  when:
    - vault_secrets_persist_prune_from is defined
    - (vault_secrets_persist_prune_from | string | trim) | length > 0
