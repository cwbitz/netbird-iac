---
# ==============================================================================
# Shared per-host encrypted secret provisioning (entry point)
# (roles/helpers/tasks/vault_secrets_dispatch.yml)
#
# Generates per-host secrets on the control node and persists them in an
# encrypted per-host vault file:
#   inventory/host_vars/<host>/<vault_secrets_vault_file>
# A secret counts as MISSING (and is generated/overwritten) when it is
# undefined, null, or empty/whitespace-only in the inventory; existing
# non-empty secrets are preserved (never rotated). The per-host vault file is
# auto-loaded by the inventory on later runs.
#
# Parameters (passed via include vars):
#   vault_secrets_component  Human-readable component name (fail messages)
#   vault_secrets_vault_file Vault filename, e.g. vault_managed.yml
#   vault_secrets_list       List of { var, type, length }:
#                                   var    Vault variable name
#                                   type   OpenSSL encoding: base64 | hex
#                                   length Bytes of entropy to generate
# ==============================================================================

- name: "[VaultSecrets] Check control-node prerequisites"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.include_tasks: control_node_prereqs.yml

- name: "[VaultSecrets] Validate secret list contract"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.assert:
    that:
      - vault_secrets_list is defined
      - vault_secrets_list | length > 0
      - vault_secrets_component is defined and (vault_secrets_component | string | trim) | length > 0
      - vault_secrets_vault_file is defined and (vault_secrets_vault_file | string | trim) | length > 0
      - vault_secrets_vault_file is regex('^[a-zA-Z0-9_.-]+\.yml$')
      - vault_secrets_list | map(attribute='var') | list | unique | length == vault_secrets_list | length
    fail_msg: >-
      Invalid {{ vault_secrets_component | default('vault_secrets') }}
      provisioning call: vault_secrets_list must be a non-empty list of
      {var, type, length} with unique var names, vault_secrets_vault_file
      a safe *.yml filename, and vault_secrets_component a non-empty string.
  run_once: true
  delegate_to: localhost
  become: false

- name: "[VaultSecrets] Validate each secret definition"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.assert:
    that:
      - item.var is defined and item.var is regex('^[a-zA-Z_][a-zA-Z0-9_]*$')
      - item.type is defined and item.type in ['base64', 'hex']
      - item.length is defined and (item.length | string) is regex('^[0-9]+$') and (item.length | int) > 0
    fail_msg: >-
      Invalid secret definition for {{ item.var | default('(undefined)') }} in
      {{ vault_secrets_component | default('vault_secrets') }}: var must
      match ^[a-zA-Z_][a-zA-Z0-9_]*$, type must be base64|hex, and length must
      be a positive integer.
  loop: "{{ vault_secrets_list }}"
  run_once: true
  delegate_to: localhost
  become: false

- name: "[VaultSecrets] Determine which secrets are missing for this host"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.set_fact:
    vault_secrets_missing: >-
      {%- set ns = namespace(missing=[]) -%}
      {%- for item in vault_secrets_list -%}
      {%-   set value = hostvars[inventory_hostname].get(item.var) -%}
      {%-   if (value is none) or ((value | string | trim) | length == 0) -%}
      {%-     set ns.missing = ns.missing + [item.var] -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ ns.missing }}
  no_log: true

- name: "[VaultSecrets] Generate and persist per-host secrets"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.include_tasks: vault_secrets_generate.yml
  run_once: true
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    loop_var: target_host

- name: "[VaultSecrets] Load provisioned secrets into this run"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.include_vars:
    file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_vault_file }}"
  when: vault_secrets_missing | length > 0

# Safety net: a generated-vault file must never be left as plaintext (e.g. if it
# was restored from a backup). Encrypt it in place if needed.
- name: "[VaultSecrets] Ensure the generated vault file is encrypted"
  tags: "{{ vault_secrets_component | default('vault_secrets') }}"
  ansible.builtin.include_tasks: ensure_vault_encrypted.yml
  vars:
    ensure_vault_encrypted_file: "{{ inventory_dir }}/host_vars/{{ inventory_hostname }}/{{ vault_secrets_vault_file }}"
