---
# ==============================================================================
# Write a mapping to a control-node vault file, encrypted (0600)
# (roles/helpers/tasks/vault_write.yml)
#
# Parameters (via include vars):
#   vault_write_file  Absolute path on the control node.
#   vault_write_data  Mapping to serialize.
# ==============================================================================

- name: "[VaultWrite] Write the plaintext file"
  ansible.builtin.copy:
    dest: "{{ vault_write_file }}"
    content: "{{ vault_write_data | to_nice_yaml }}"
    mode: "0600"
  no_log: true
  delegate_to: localhost
  become: false

- name: "[VaultWrite] Ensure the file is encrypted"
  ansible.builtin.include_tasks: ensure_vault_encrypted.yml
  vars:
    ensure_vault_encrypted_file: "{{ vault_write_file }}"
