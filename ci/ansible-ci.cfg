# CI-only Ansible configuration, selected via ANSIBLE_CONFIG in
# .github/workflows/ci.yml. Points at a vault-free inventory so lint and
# syntax-check run on GitHub without any encrypted host_vars. Deliberately
# omits vault_password_file: the repository ansible.cfg preloads the user's
# local vault password, which does not exist in CI.
# Relative paths resolve against the directory holding this config (ci/).
[defaults]
inventory               = ./inventory.yml
roles_path              = ../roles
retry_files_enabled     = False
nocows                  = True
interpreter_python      = auto_silent

[inventory]
unparsed_is_failed      = True
