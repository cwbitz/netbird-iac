# mise project config (https://mise.jdx.dev).
#
# Tool VERSIONS live in `.tool-versions` (single source of truth for mise and
# asdf); this file has no [tools] section. Every task wraps the Makefile, so
# `make ...` and `mise run ...` do the same thing.

[tasks.lint]
description = "Syntax check + ansible-lint (make ans-lint)"
run = "make ans-lint"

[tasks.deps]
description = "Install the pinned toolchain + collections (make ans-deps)"
run = "make ans-deps"

[tasks.check]
description = "Dry-run the site playbook (make ans-check)"
run = "make ans-check"

[tasks.deploy]
description = "Deploy the NetBird self-hosted server (make ans-site)"
run = "make ans-site"
