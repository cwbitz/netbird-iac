---
# ==============================================================================
# Apply the declarative NetBird tenant configuration (desired state as code).
#
# Uses the community.ansible_netbird collection's Config-as-Code workflow:
#   netbird_config/  ->  settings, groups, posture checks, setup keys, networks,
#                        DNS, and access policies (name-based, ordered, diffable)
# plus a small users.yml applied via the netbird_user module.
#
# PREVIEW BY DEFAULT: nothing is changed unless tenant_commit=true.
#   make netbird-plan          # read-only diff
#   make netbird-apply         # apply
#   make netbird-apply-strict  # apply + remove unmanaged resources
#
# Requires vault_admin_service_user_access_token (the 'admin' service-user PAT
# provisioned by the server bootstrap; on older hosts the deprecated vault_pat is
# still accepted as a fallback).
# ==============================================================================

- name: Apply NetBird tenant configuration as code
  hosts: netbird
  connection: local
  gather_facts: false
  vars:
    config_dir: "{{ playbook_dir }}/../netbird_config"
    netbird_api_url: "https://{{ domain_name }}"
    netbird_api_token: "{{ vault_admin_service_user_access_token | default(vault_pat | default('')) }}"
    netbird_validate_certs: true
    tenant_commit: false
    tenant_strict: false
    # Run the API modules with the control node's Ansible Python (connection is
    # local); avoids interpreter-discovery picking a non-existent system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"

  tasks:
    - name: "[Tenant] Assert an access token is configured"
      ansible.builtin.assert:
        that:
          - netbird_api_token | length > 0
        fail_msg: >-
          Set vault_admin_service_user_access_token in
          inventory/host_vars/<host>/vault.yml. On a fresh deploy it is created
          automatically during the first-owner bootstrap; otherwise create an
          'admin' service user and its Access Token in the NetBird Dashboard
          (Team -> Service Users) and store it there. Re-run afterwards.

    - name: "[Tenant] Probe the access token against the API"
      ansible.builtin.uri:
        url: "{{ netbird_api_url }}/api/users"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Token {{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        status_code: [200, 401, 403]
        return_content: false
      register: token_probe
      changed_when: false
      no_log: true

    - name: "[Tenant] Stop with recovery instructions when the token is rejected"
      ansible.builtin.assert:
        that:
          - token_probe.status | default(0) == 200
        fail_msg: >-
          The NetBird access token was rejected (HTTP
          {{ token_probe.status | default('n/a') }}). Personal Access
          Tokens expire (NetBird caps them at 365 days) and cannot be renewed
          once invalid. Recreate one: log in to the Dashboard as the owner
          ({{ netbird_api_url }}), open Team -> Service Users -> 'admin' ->
          Access Tokens -> Create Access Token, then store it as
          vault_admin_service_user_access_token in
          inventory/host_vars/{{ inventory_hostname }}/vault.yml and re-run.

    # --------------------------------------------------------------------------
    # Desired state: settings, groups, posture checks, setup keys, networks,
    # DNS and policies. The role resolves plain names to IDs and applies in
    # dependency order. With commit=false it only renders a read-only diff.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Apply the config-as-code desired state"
      ansible.builtin.include_role:
        name: community.ansible_netbird.configure
      vars:
        commit: "{{ tenant_commit }}"
        strict: "{{ tenant_strict }}"

    # --------------------------------------------------------------------------
    # Users and service users are not covered by the collection's Config-as-Code
    # skeleton, so they are applied here via the netbird_user module. Runs only
    # on commit (never during preview) and after groups exist.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Load the user definitions"
      ansible.builtin.include_vars:
        file: "{{ config_dir }}/users.yml"
        name: tenant_users_file
      failed_when: false
      when: tenant_commit | bool

    - name: "[Tenant] Manage users and service users"
      community.ansible_netbird.netbird_user:
        api_url: "{{ netbird_api_url }}"
        api_token: "{{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        email: "{{ item.email | default(omit) }}"
        name: "{{ item.name | default(item.email) }}"
        role: "{{ item.role | default('user') }}"
        auto_groups: "{{ item.auto_groups | default(omit) }}"
        is_service_user: "{{ item.is_service_user | default(false) }}"
        state: "{{ item.state | default('present') }}"
      loop: >-
        {{ (tenant_users_file.netbird_users | default([]))
           + (tenant_users_file.netbird_service_users | default([])) }}
      loop_control:
        label: "{{ item.name | default(item.email) }}"
      no_log: true
      when:
        - tenant_commit | bool
        - ((tenant_users_file.netbird_users | default([]) | length)
           + (tenant_users_file.netbird_service_users | default([]) | length)) > 0
