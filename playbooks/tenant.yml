---
# ==============================================================================
# Apply the declarative NetBird tenant configuration (desired state as code).
#
# The desired state is expressed as Ansible variables in the per-host vars
# (inventory/host_vars/<host>/main.yml for non-secret values, vault.yml for
# secrets/PII). Because the community.ansible_netbird configure role reads a
# directory of raw YAML (it does not template), this play renders those
# variables into a generated config directory and hands it to the role:
#
#   inventory/host_vars/<host>/{main,vault}.yml  ->  generated YAML  ->  API
#
# Generated directory (gitignored, regenerated every run, per host):
#   .ansible_cache/tenant_config/<host>/
#
# Dumped every run from the variables below, so it is never hand-edited:
#   netbird_settings, netbird_groups, netbird_posture_checks, netbird_policies,
#   netbird_dns_nameserver_groups, netbird_dns_zones,
#   netbird_dns_disabled_management_groups, netbird_networks,
#   netbird_setup_keys, netbird_services, netbird_service_domains,
#   netbird_an_settings, netbird_an_providers, netbird_an_guardrails,
#   netbird_an_policies, netbird_an_budget_rules.
#
# Users/service users are NOT part of the collection's Config-as-Code model (it
# ships a separate netbird_user module instead), so they are applied here
# directly from netbird_users / netbird_service_users, gated on commit.
#
# PREVIEW BY DEFAULT: nothing is changed unless tenant_commit=true.
#   make netbird-plan          # read-only diff
#   make netbird-apply         # apply
#   make netbird-apply-strict  # apply + remove unmanaged resources
#
# Requires vault_admin_service_user_access_token (the 'admin' service-user PAT
# provisioned by the server bootstrap; on older hosts the deprecated vault_pat is
# still accepted as a fallback).
# ==============================================================================

- name: Apply NetBird tenant configuration as code
  hosts: netbird
  connection: local
  gather_facts: false
  vars:
    # Generated config directory (gitignored; see .ansible_cache/ in .gitignore).
    tenant_build_dir: "{{ playbook_dir }}/../.ansible_cache/tenant_config/{{ inventory_hostname }}"
    config_dir: "{{ tenant_build_dir }}"
    netbird_api_url: "https://{{ domain_name }}"
    netbird_api_token: "{{ vault_admin_service_user_access_token | default(vault_pat | default('')) }}"
    netbird_validate_certs: true
    tenant_commit: false
    tenant_strict: false
    # Run the API modules with the control node's Ansible Python (connection is
    # local); avoids interpreter-discovery picking a non-existent system Python.
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # The tenant phase is local API work (no privilege needed). Disable the
    # per-host become so the generated files and the collection's localhost
    # operations run as the same non-root user.
    ansible_become: false

  tasks:
    - name: "[Tenant] Assert an access token is configured"
      ansible.builtin.assert:
        that:
          - netbird_api_token | length > 0
        fail_msg: >-
          Set vault_admin_service_user_access_token in
          inventory/host_vars/<host>/vault.yml. On a fresh deploy it is created
          automatically during the first-owner bootstrap; otherwise create an
          'admin' service user and its Access Token in the NetBird Dashboard
          (Team -> Service Users) and store it there. Re-run afterwards.

    - name: "[Tenant] Probe the access token against the API"
      ansible.builtin.uri:
        url: "{{ netbird_api_url }}/api/users"
        method: GET
        headers:
          Accept: application/json
          Authorization: "Token {{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        status_code: [200, 401, 403]
        return_content: false
      register: token_probe
      changed_when: false
      no_log: true

    - name: "[Tenant] Stop with recovery instructions when the token is rejected"
      ansible.builtin.assert:
        that:
          - token_probe.status | default(0) == 200
        fail_msg: >-
          The NetBird access token was rejected (HTTP
          {{ token_probe.status | default('n/a') }}). Personal Access
          Tokens expire (NetBird caps them at 365 days) and cannot be renewed
          once invalid. Recreate one: log in to the Dashboard as the owner
          ({{ netbird_api_url }}), open Team -> Service Users -> 'admin' ->
          Access Tokens -> Create Access Token, then store it as
          vault_admin_service_user_access_token in
          inventory/host_vars/{{ inventory_hostname }}/vault.yml and re-run.

    # --------------------------------------------------------------------------
    # A routed network references its router/gateway PEER by name, but that peer
    # is enrolled by the client project using a setup key this play creates — so
    # on the first run the gateway does not exist yet. Fetch the live peers and
    # keep only networks whose routers are all enrolled; a network without its
    # gateway is skipped (with a warning) and converges automatically on a later
    # run once the client has joined. No manual toggling needed.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Fetch peers for routed-network readiness"
      community.ansible_netbird.netbird_info:
        api_url: "{{ netbird_api_url }}"
        api_token: "{{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        resource: peers
      register: tenant_peers_info
      changed_when: false
      no_log: true
      when: (netbird_networks | default([]) | length) > 0

    - name: "[Tenant] Separate routed networks by gateway-peer readiness"
      ansible.builtin.set_fact:
        tenant_network_split: >-
          {%- set known = (tenant_peers_info.data | default([]) | map(attribute='name') | list)
                         + (tenant_peers_info.data | default([]) | map(attribute='hostname') | list) -%}
          {%- set ns = namespace(ready=[], pending=[]) -%}
          {%- for net in (netbird_networks | default([])) -%}
          {%-   set missing = namespace(count=0) -%}
          {%-   for r in (net.routers | default([])) -%}
          {%-     if r.peer not in known -%}{%- set missing.count = missing.count + 1 -%}{%- endif -%}
          {%-   endfor -%}
          {%-   if missing.count == 0 -%}
          {%-     set _ = ns.ready.append(net) -%}
          {%-   else -%}
          {%-     set _ = ns.pending.append(net.name) -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ {'ready': ns.ready, 'pending': ns.pending} }}
      when: (netbird_networks | default([]) | length) > 0

    - name: "[Tenant] Keep only routed networks whose gateway peers are enrolled"
      ansible.builtin.set_fact:
        netbird_networks: "{{ tenant_network_split.ready | default([]) }}"
      when: tenant_network_split is defined

    - name: "[Tenant] Warn about routed networks waiting for gateway enrollment"
      ansible.builtin.debug:
        msg: >-
          Skipped routed network(s) {{ tenant_network_split.pending }}: their
          router peer(s) are not enrolled yet. Enroll the client (which consumes
          the setup key this play persists), then re-run to activate them.
      when: (tenant_network_split.pending | default([])) | length > 0

    # --------------------------------------------------------------------------
    # Generate the config directory the collection role consumes from the
    # per-host variables (the role reads raw YAML and does not template).
    # --------------------------------------------------------------------------
    - name: "[Tenant] Clean the generated config directory"
      ansible.builtin.file:
        path: "{{ tenant_build_dir }}"
        state: absent

    - name: "[Tenant] Create the generated config directory tree"
      ansible.builtin.file:
        path: "{{ tenant_build_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "."
        - "access_control"
        - "dns"

    - name: "[Tenant] Render the single-variable config files"
      ansible.builtin.copy:
        dest: "{{ tenant_build_dir }}/{{ item.path }}"
        content: "{{ {item.var: lookup('vars', item.var, default=item.default)} | to_nice_yaml(indent=2) }}"
        mode: "0600"
      loop:
        - { path: "settings.yml", var: "netbird_settings", default: {} }
        - { path: "access_control/groups.yml", var: "netbird_groups", default: [] }
        - { path: "access_control/posture_checks.yml", var: "netbird_posture_checks", default: [] }
        - { path: "access_control/policies.yml", var: "netbird_policies", default: [] }
        - { path: "dns/nameservers.yml", var: "netbird_dns_nameserver_groups", default: [] }
        - { path: "dns/zones.yml", var: "netbird_dns_zones", default: [] }
        - { path: "dns/settings.yml", var: "netbird_dns_disabled_management_groups", default: [] }
        - { path: "networks.yml", var: "netbird_networks", default: [] }
        - { path: "setup_keys.yml", var: "netbird_setup_keys", default: [] }
      loop_control:
        label: "{{ item.path }}"

    - name: "[Tenant] Render services.yml (two variables per file)"
      ansible.builtin.copy:
        dest: "{{ tenant_build_dir }}/services.yml"
        content: >-
          {{ { 'netbird_services': netbird_services | default([]),
               'netbird_service_domains': netbird_service_domains | default([]) }
             | to_nice_yaml(indent=2) }}
        mode: "0600"

    - name: "[Tenant] Render agent_network.yml (multiple variables per file)"
      ansible.builtin.copy:
        dest: "{{ tenant_build_dir }}/agent_network.yml"
        content: >-
          {{ { 'netbird_an_settings': netbird_an_settings | default({}),
               'netbird_an_providers': netbird_an_providers | default([]),
               'netbird_an_guardrails': netbird_an_guardrails | default([]),
               'netbird_an_policies': netbird_an_policies | default([]),
               'netbird_an_budget_rules': netbird_an_budget_rules | default([]) }
             | to_nice_yaml(indent=2) }}
        mode: "0600"

    # --------------------------------------------------------------------------
    # Desired state: settings, groups, posture checks, setup keys, networks,
    # DNS, services and policies. The role resolves plain names to IDs and
    # applies in dependency order. With commit=false it only renders a read-only
    # diff.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Apply the config-as-code desired state"
      ansible.builtin.include_role:
        name: community.ansible_netbird.configure
      vars:
        commit: "{{ tenant_commit }}"
        strict: "{{ tenant_strict }}"

    # --------------------------------------------------------------------------
    # A setup key's secret is returned by the API only at creation and cannot be
    # retrieved afterwards. Persist each newly created key into the encrypted
    # vault_managed.yml as vault_setup_key_<sanitized-name>, so enrolling peers
    # later does not require recreating the key.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Persist newly created setup key values in the vault"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_secrets_persist
      vars:
        vault_secrets_persist_vault_file: "vault_managed.yml"
        vault_secrets_persist_name: "vault_setup_key_{{ item.item.name | regex_replace('[^A-Za-z0-9_]', '_') }}"
        vault_secrets_persist_value: "{{ item.setup_key.key }}"
      loop: "{{ (netbird_setup_key_results | default({'results': []})).results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when:
        - tenant_commit | bool
        - item.changed | default(false)
        - (item.setup_key.key | default('')) | length > 0

    # --------------------------------------------------------------------------
    # Users and service users are not covered by the collection's Config-as-Code
    # model (it ships a separate netbird_user module), so they are applied here
    # from netbird_users / netbird_service_users. The module takes group IDs for
    # auto_groups, so plain names are resolved against the live groups first.
    # Runs only on commit (never during preview) and after groups exist.
    # --------------------------------------------------------------------------
    - name: "[Tenant] Fetch groups for user auto_groups resolution"
      community.ansible_netbird.netbird_info:
        api_url: "{{ netbird_api_url }}"
        api_token: "{{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        resource: groups
      register: tenant_groups_info
      changed_when: false
      no_log: true
      when:
        - tenant_commit | bool
        - ((netbird_users | default([]) | length)
           + (netbird_service_users | default([]) | length)) > 0

    - name: "[Tenant] Map group names to IDs"
      ansible.builtin.set_fact:
        tenant_group_ids: >-
          {{ dict((tenant_groups_info.data | default([]) | map(attribute='name') | list)
                  | zip(tenant_groups_info.data | default([]) | map(attribute='id') | list)) }}
      no_log: true
      when:
        - tenant_commit | bool
        - tenant_groups_info is defined and tenant_groups_info.data is defined

    - name: "[Tenant] Build the flat user list (mark service users, resolve auto_groups)"
      ansible.builtin.set_fact:
        tenant_users_flat: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for u in (netbird_users | default([])) -%}
          {%-   set groups = (u.auto_groups | default([])) | map('extract', tenant_group_ids) | list -%}
          {%-   set _ = ns.items.append(u | combine({'is_service_user': u.is_service_user | default(false), 'auto_groups': groups})) -%}
          {%- endfor -%}
          {%- for u in (netbird_service_users | default([])) -%}
          {%-   set groups = (u.auto_groups | default([])) | map('extract', tenant_group_ids) | list -%}
          {%-   set _ = ns.items.append(u | combine({'is_service_user': u.is_service_user | default(true), 'auto_groups': groups})) -%}
          {%- endfor -%}
          {{ ns.items }}
      when: tenant_commit | bool

    - name: "[Tenant] Manage users and service users"
      community.ansible_netbird.netbird_user:
        api_url: "{{ netbird_api_url }}"
        api_token: "{{ netbird_api_token }}"
        validate_certs: "{{ netbird_validate_certs }}"
        email: "{{ item.email | default(omit) }}"
        name: "{{ item.name | default(item.email) }}"
        role: "{{ item.role | default('user') }}"
        auto_groups: "{{ item.auto_groups | default(omit) }}"
        is_service_user: "{{ item.is_service_user | default(false) }}"
        state: "{{ item.state | default('present') }}"
      loop: "{{ tenant_users_flat | default([]) }}"
      loop_control:
        label: "{{ item.name | default(item.email) }}"
      no_log: true
      when:
        - tenant_commit | bool
        - (tenant_users_flat | default([]) | length) > 0
