---
# ==============================================================================
# Host bootstrap (`make host-bootstrap`; never part of playbooks/site.yml).
#
# It probes the SSH identities in order [ansible, admin, root] and uses the
# first that works. If that identity is NOT `ansible`, it (re)creates the
# least-privilege `ansible` service account; if it already IS `ansible` it only
# applies the optional mirrors. This self-heals a deleted/rotated ansible
# password or key (ansible login fails -> falls back to root -> recreates it).
#
# SSH public keys (per identity, opt-in) — for every identity whose
#   vault_{root,admin,ansible}_ssh_pubkey_file is set, the key at that
#   control-node path is authorized for the matching account on the target.
#   Unset/empty -> skipped (keys are never auto-generated). Paths only, never
#   raw key strings. The matching private keys the control node connects with
#   live in vault.yml too (vault_<id>_ssh_privkey_file).
#
# Service account auth (ansible identity) — exactly one of:
#   vault_ansible_ssh_pubkey_file  control-node path to the .pub file (key auth)
#   (neither)                      a password is set (password auth):
#                                  host_bootstrap_password (optional;
#                                  else generated into vault_ansible_password)
#   If sshd has password auth disabled, login fails — sshd config is out of scope.
#
# Region mirrors (each a no-op unless set):
#   host_apt_mirror / host_apt_security_mirror (derived) / docker_registry_mirrors
# ==============================================================================

- name: Probe the SSH identities (ansible -> admin -> root)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbird_target: "{{ hostvars[groups['netbird'][0]] }}"
    probe_host: "{{ netbird_target.ansible_host }}"
    probe_port: "{{ netbird_target.ansible_port | default(22) }}"
  tasks:
    - name: "[Probe] Try each identity over SSH"
      ansible.builtin.shell: |
        set -u
        HOST="{{ probe_host }}"; PORT="{{ probe_port }}"
        try_identity() {
          id="$1"
          user=$(eval echo "\$PROBE_${id}_USER")
          pw=$(eval echo "\$PROBE_${id}_PW")
          key=$(eval echo "\$PROBE_${id}_KEY")
          [ -z "$user" ] && return 1
          kopt=""; [ -n "$key" ] && kopt="-i $key"
          base="-o StrictHostKeyChecking=accept-new -o ConnectTimeout=8 -o Port=$PORT"
          base="$base -o PreferredAuthentications=publickey,password -o NumberOfPasswordPrompts=1"
          if [ -n "$pw" ]; then
            SSHPASS="$pw" sshpass -e ssh $base $kopt "$user@$HOST" true >/dev/null 2>&1 && return 0
          else
            ssh $base -o BatchMode=yes $kopt "$user@$HOST" true >/dev/null 2>&1 && return 0
          fi
          return 1
        }
        for id in ANSIBLE ADMIN ROOT; do
          if try_identity "$id"; then echo "$id"; exit 0; fi
        done
        exit 1
      args:
        executable: /bin/bash
      environment:
        PROBE_ANSIBLE_USER: "{{ netbird_target.host_ssh_identities.ansible.user }}"
        PROBE_ANSIBLE_PW: "{{ netbird_target.host_ssh_identities.ansible.password }}"
        PROBE_ANSIBLE_KEY: "{{ netbird_target.host_ssh_identities.ansible.privkey }}"
        PROBE_ADMIN_USER: "{{ netbird_target.host_ssh_identities.admin.user }}"
        PROBE_ADMIN_PW: "{{ netbird_target.host_ssh_identities.admin.password }}"
        PROBE_ADMIN_KEY: "{{ netbird_target.host_ssh_identities.admin.privkey }}"
        PROBE_ROOT_USER: "{{ netbird_target.host_ssh_identities.root.user }}"
        PROBE_ROOT_PW: "{{ netbird_target.host_ssh_identities.root.password }}"
        PROBE_ROOT_KEY: "{{ netbird_target.host_ssh_identities.root.privkey }}"
      register: probe
      changed_when: false
      no_log: true
      failed_when: false

    - name: "[Probe] Fail if no identity can connect"
      ansible.builtin.assert:
        that:
          - probe.rc == 0
        fail_msg: >-
          Could not log in as ansible, admin or root with the configured
          credentials. Check inventory/host_vars/<host>/vault.yml
          (vault_{ansible,admin,root}_password / _ssh_privkey_file) and the host.

    - name: "[Probe] Record the working identity"
      ansible.builtin.set_fact:
        probe_identity: "{{ probe.stdout | trim }}"
    - name: "[Probe] Resolve the chosen connection settings"
      ansible.builtin.set_fact:
        probe_chosen: "{{ netbird_target.host_ssh_identities[probe_identity | lower] }}"

    - name: "[Probe] Register the target in the bootstrap group"
      ansible.builtin.add_host:
        name: "{{ groups['netbird'][0] }}"
        groups: netbird_bootstrap
        probe_identity: "{{ probe.stdout | trim }}"

    - name: "[Probe] Report the working identity"
      ansible.builtin.debug:
        msg: "Connected as '{{ probe_identity }}' ({{ probe_chosen.user }})."

- name: Bootstrap host system tuning
  hosts: netbird_bootstrap
  gather_facts: true
  # add_host vars rank below inventory host_vars, so the probed connection
  # identity must be applied as play vars to actually take effect.
  vars:
    ansible_user: "{{ hostvars['localhost'].probe_chosen.user }}"
    ansible_password: "{{ hostvars['localhost'].probe_chosen.password }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].probe_chosen.privkey }}"
    ansible_become: "{{ hostvars['localhost'].probe_chosen.become }}"
  handlers:
    - name: Restart docker
      ansible.builtin.systemd_service:
        name: docker
        state: restarted

  tasks:
    # --------------------------------------------------------------------------
    # APT mirror (Debian-family)
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Validate the APT mirror settings"
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          host_apt_mirror is set, but the host is not Debian-family.
          Example: host_apt_mirror: https://mirrors.tuna.tsinghua.edu.cn/debian
      when: host_apt_mirror | default('') | length > 0

    - name: "[Bootstrap] Back up the current APT sources (once)"
      ansible.builtin.copy:
        src: /etc/apt/sources.list
        dest: /etc/apt/sources.list.bak.bootstrap
        remote_src: true
        force: false
        mode: "0644"
      when: host_apt_mirror | default('') | length > 0

    - name: "[Bootstrap] Render the APT sources from the mirror"
      ansible.builtin.template:
        src: templates/apt-sources.list.j2
        dest: /etc/apt/sources.list
        owner: root
        group: root
        mode: "0644"
      register: apt_sources
      when: host_apt_mirror | default('') | length > 0

    - name: "[Bootstrap] Refresh the APT cache"
      ansible.builtin.apt:
        update_cache: true
      when:
        - host_apt_mirror | default('') | length > 0
        - apt_sources.changed | default(false)

    # --------------------------------------------------------------------------
    # Docker Engine (auto-install when missing)
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Ensure Docker Engine and the Compose v2 plugin are present"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: install_docker

    # --------------------------------------------------------------------------
    # Docker Hub registry mirrors
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Check that Docker is installed"
      ansible.builtin.command: docker --version
      register: bootstrap_docker
      changed_when: false
      failed_when: false
      when: docker_registry_mirrors | default([]) | length > 0

    - name: "[Bootstrap] Assert Docker is installed for registry mirrors"
      ansible.builtin.assert:
        that:
          - bootstrap_docker.rc | default(1) == 0
        fail_msg: >-
          docker_registry_mirrors is set but Docker is not installed on
          {{ inventory_hostname }}; install Docker first.
      when: docker_registry_mirrors | default([]) | length > 0

    - name: "[Bootstrap] Read the existing Docker daemon.json (if any)"
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: bootstrap_daemon
      failed_when: false
      when: docker_registry_mirrors | default([]) | length > 0

    - name: "[Bootstrap] Merge registry mirrors into daemon.json"
      ansible.builtin.copy:
        content: >-
          {{ (bootstrap_daemon.content | default('e30=') | b64decode | from_json)
             | combine({'registry-mirrors': docker_registry_mirrors}) | to_nice_json }}
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      when: docker_registry_mirrors | default([]) | length > 0
      notify: Restart docker

    # --------------------------------------------------------------------------
    # Service account: create/repair only when we did NOT connect as ansible.
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the service account settings"
      ansible.builtin.set_fact:
        bootstrap_service_user: "{{ host_bootstrap_user | default('ansible') }}"
        bootstrap_use_key: "{{ vault_ansible_ssh_pubkey_file | default('') | length > 0 }}"

    - name: "[Bootstrap] Provision a service-account password (no key supplied)"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_secrets_dispatch
      vars:
        vault_secrets_component: "netbird_bootstrap"
        vault_secrets_vault_file: "vault_managed.yml"
        vault_secrets_list:
          - var: "vault_ansible_password"
            type: "base64"
            length: 18
      when: not (bootstrap_use_key | bool)

    - name: "[Bootstrap] Resolve the effective service-account password"
      ansible.builtin.set_fact:
        host_bootstrap_password_final: >-
          {{ host_bootstrap_password
             if (host_bootstrap_password | default('') | length > 0)
             else (vault_ansible_password | default('')) }}
      when: not (bootstrap_use_key | bool)

    - name: "[Bootstrap] Create/repair the service account"
      ansible.builtin.user:
        name: "{{ bootstrap_service_user }}"
        groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
        append: true
        shell: /bin/bash
        create_home: true
        state: present
      when: probe_identity | lower != 'ansible'

    - name: "[Bootstrap] Set the account password (password-auth mode)"
      ansible.builtin.user:
        name: "{{ bootstrap_service_user }}"
        password: "{{ host_bootstrap_password_final | password_hash('sha512', 'netbirdiacsalt') }}"
        update_password: always
      when:
        - probe_identity | lower != 'ansible'
        - not (bootstrap_use_key | bool)

    # --------------------------------------------------------------------------
    # Admin identity (optional): when the user defines admin credentials and/or
    # a public key, create/repair the account and set its password here. Root
    # always exists and is never created; the service account is handled above.
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the admin identity settings"
      ansible.builtin.set_fact:
        bootstrap_admin: "{{ host_ssh_identities.admin }}"
        bootstrap_admin_defined: >-
          {{ (host_ssh_identities.admin.password | default('') | length > 0)
             or (host_ssh_identities.admin.pubkey | default('') | length > 0) }}

    - name: "[Bootstrap] Create/repair the admin account"
      ansible.builtin.user:
        name: "{{ bootstrap_admin.user }}"
        groups: "{{ 'sudo' if ansible_os_family == 'Debian' else 'wheel' }}"
        append: true
        shell: /bin/bash
        create_home: true
        state: present
      when:
        - bootstrap_admin_defined | bool
        - bootstrap_admin.user != 'root'
        - bootstrap_admin.user != bootstrap_service_user

    - name: "[Bootstrap] Set the admin account password"
      ansible.builtin.user:
        name: "{{ bootstrap_admin.user }}"
        password: "{{ bootstrap_admin.password | password_hash('sha512', 'netbirdiacsalt') }}"
        update_password: always
      when:
        - bootstrap_admin_defined | bool
        - bootstrap_admin.user != 'root'
        - bootstrap_admin.password | default('') | length > 0

    # --------------------------------------------------------------------------
    # SSH public keys (per identity, opt-in): authorize every explicitly supplied
    # vault_<id>_ssh_pubkey_file for its account. Empty/unset -> ignored (never
    # generated). Independent of the service-account key/password mode above.
    # --------------------------------------------------------------------------
    - name: "[Bootstrap] Resolve the explicitly supplied public keys"
      ansible.builtin.set_fact:
        bootstrap_pubkey_specs: >-
          {%- set ns = namespace(specs=[]) -%}
          {%- for id, ident in host_ssh_identities.items() -%}
          {%-   if (ident.pubkey | default('') | string | trim) | length > 0 -%}
          {%-     set ns.specs = ns.specs + [{'id': id, 'user': ident.user, 'path': ident.pubkey}] -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ ns.specs }}

    - name: "[Bootstrap] Read the supplied public key files"
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      register: bootstrap_pubkey_files
      delegate_to: localhost
      become: false
      loop: "{{ bootstrap_pubkey_specs }}"
      loop_control:
        label: "{{ item.id }}"

    - name: "[Bootstrap] Check that each public-key account exists"
      ansible.builtin.getent:
        database: passwd
        key: "{{ item.user }}"
      register: bootstrap_pubkey_users
      failed_when: false
      loop: "{{ bootstrap_pubkey_specs }}"
      loop_control:
        label: "{{ item.id }}"

    - name: "[Bootstrap] Fail if a public key targets a missing account"
      ansible.builtin.assert:
        that:
          - bootstrap_pubkey_users.results | default([])
            | selectattr('msg', 'defined') | selectattr('msg', 'ne', '') | list | length == 0
        fail_msg: >-
          vault_<id>_ssh_pubkey_file is set for account(s) that are not managed
          by this bootstrap and do not exist on {{ inventory_hostname }}:
          {{ bootstrap_pubkey_users.results | default([])
             | selectattr('msg', 'defined') | selectattr('msg', 'ne', '')
             | map(attribute='item.user') | join(', ') }}.
          Only the root, service (ansible) and explicitly configured admin
          accounts are provisioned; clear the pubkey path(s) or create the
          account(s) first.
      when: bootstrap_pubkey_specs | length > 0

    - name: "[Bootstrap] Ensure each account's .ssh directory exists"
      ansible.builtin.file:
        path: "{{ ('/root' if item.item.user == 'root' else '/home/' ~ item.item.user) }}/.ssh"
        state: directory
        owner: "{{ item.item.user }}"
        group: "{{ item.item.user }}"
        mode: "0700"
      loop: "{{ bootstrap_pubkey_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"

    - name: "[Bootstrap] Authorize each supplied public key for its account"
      ansible.builtin.lineinfile:
        path: "{{ ('/root' if item.item.user == 'root' else '/home/' ~ item.item.user) }}/.ssh/authorized_keys"
        line: "{{ item.content | b64decode | trim }}"
        create: true
        owner: "{{ item.item.user }}"
        group: "{{ item.item.user }}"
        mode: "0600"
      loop: "{{ bootstrap_pubkey_files.results | default([]) }}"
      loop_control:
        label: "{{ item.item.id }}"

    - name: "[Bootstrap] Resolve the passwordless-sudo accounts"
      ansible.builtin.set_fact:
        bootstrap_sudo_users: >-
          {{ ([bootstrap_service_user]
              + ([bootstrap_admin.user]
                 if (bootstrap_admin_defined | default(false) | bool
                     and bootstrap_admin.user | default('') != 'root')
                 else []))
             | unique }}

    - name: "[Bootstrap] Grant passwordless sudo"
      ansible.builtin.copy:
        content: "{{ item }} ALL=(ALL) NOPASSWD:ALL\n"
        dest: "/etc/sudoers.d/90-netbird-{{ item }}"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      loop: "{{ bootstrap_sudo_users }}"
      when: host_bootstrap_sudo_nopasswd | default(true) | bool

    - name: "[Bootstrap] Report the outcome"
      ansible.builtin.debug:
        msg: >-
          Probed as '{{ probe_identity }}'. Service account
          '{{ bootstrap_service_user }}'{{ " and admin account '" ~ bootstrap_admin.user ~ "'"
          if bootstrap_admin_defined | bool else "" }} should exist; subsequent
          runs connect via vault_{ansible,admin,root}_* in
          inventory/host_vars/{{ inventory_hostname }}/vault.yml.
