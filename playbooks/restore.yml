---
# ==============================================================================
# Restore the NetBird server state from a backup made by playbooks/backup.yml.
#
#   make restore FROM=backup/<host>/<timestamp>
#
# Replaces the data volume with the archived contents, then redeploys the stack.
# config.yaml is re-rendered from the control node's existing
# inventory/host_vars/<host>/vault.yml, so that file must hold the SAME
# datastore encryptionKey as when the data was backed up; otherwise the restored
# data cannot be decrypted.
# ==============================================================================

- name: Restore the NetBird server state
  hosts: netbird
  gather_facts: false
  vars:
    restore_from: ""
    restore_volume: "{{ netbird_data_volume | default('netbird_data') }}"
  tasks:
    - name: "[Restore] Require restore_from"
      ansible.builtin.assert:
        that:
          - restore_from | length > 0
        fail_msg: "Usage: make restore FROM=backup/<host>/<timestamp>"

    - name: "[Restore] Resolve the backup path to an absolute path"
      ansible.builtin.set_fact:
        restore_from: "{{ restore_from | realpath }}"
      delegate_to: localhost
      become: false

    - name: "[Restore] Stat the backup archive on the control node"
      ansible.builtin.stat:
        path: "{{ restore_from }}/netbird_data.tgz"
      register: restore_archive
      delegate_to: localhost
      become: false

    - name: "[Restore] Fail early if the archive is missing"
      ansible.builtin.assert:
        that:
          - restore_archive.stat.exists | default(false)
        fail_msg: "No netbird_data.tgz under {{ restore_from }}/."

    - name: "[Restore] Stop the stack"
      community.docker.docker_compose_v2:
        project_src: "{{ stack_dir }}"
        state: stopped

    - name: "[Restore] Copy the archive to the host"
      ansible.builtin.copy:
        src: "{{ restore_from }}/netbird_data.tgz"
        dest: /tmp/netbird_data.tgz
        mode: "0600"

    - name: "[Restore] Replace the data volume contents"
      ansible.builtin.command: >-
        docker run --rm
        -v {{ restore_volume }}:/data
        -v /tmp:/backup
        alpine sh -c "rm -rf /data/..?* /data/.[!.]* /data/* && tar xzf /backup/netbird_data.tgz -C /data"
      changed_when: true

    - name: "[Restore] Remove the remote archive"
      ansible.builtin.file:
        path: /tmp/netbird_data.tgz
        state: absent

    - name: "[Restore] Redeploy the stack with the current vault key"
      ansible.builtin.include_role:
        name: netbird_server

    - name: "[Restore] Report"
      ansible.builtin.debug:
        msg: "Restored from {{ restore_from }} and redeployed."
