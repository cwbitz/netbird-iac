---
# ==============================================================================
# Migrate per-host keys to disjoint vault ownership.
#
#   make vault-migrate            # single-host inventory auto-detected
#   make vault-migrate HOST=<host>
#
# Key ownership rule (control-authoritative vs host-authoritative):
#   vault.yml         — user-supplied OR control-generated inputs passed TO the
#                       host: the datastore/session/relay crypto keys, the owner
#                       password and the ansible service-account password.
#   vault_managed.yml — secrets generated BY the host and returned to the control
#                       node: the admin service-user PAT and setup-key secrets.
#
# This moves any control-authoritative key still found in vault_managed.yml over
# to vault.yml (only when vault.yml does not already define it) and removes it
# from vault_managed.yml. Idempotent and safe to re-run.
# ==============================================================================

- name: Migrate vault keys to disjoint ownership
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    vault_migrate_control_keys:
      - vault_datastore_encryption_key
      - vault_session_cookie_encryption_key
      - vault_relay_auth_secret
      - vault_owner_password
      - vault_ansible_password
  tasks:
    - name: "[VaultMigrate] Require the target host and directory"
      ansible.builtin.assert:
        that:
          - migrate_host is defined and (migrate_host | string | trim) | length > 0
          - vault_host_dir is defined and (vault_host_dir | string | trim) | length > 0
        fail_msg: "Usage: make vault-migrate HOST=<hostname>"

    - name: "[VaultMigrate] Resolve the per-host vault paths"
      ansible.builtin.set_fact:
        vault_migrate_managed_file: "{{ vault_host_dir }}/vault_managed.yml"
        vault_migrate_vault_file: "{{ vault_host_dir }}/vault.yml"

    - name: "[VaultMigrate] Read vault_managed.yml"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_read
      vars:
        vault_read_file: "{{ vault_migrate_managed_file }}"

    - name: "[VaultMigrate] Keep the managed mapping"
      ansible.builtin.set_fact:
        vault_migrate_managed: "{{ vault_read_data | default({}) }}"
      no_log: true

    - name: "[VaultMigrate] Read vault.yml"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_read
      vars:
        vault_read_file: "{{ vault_migrate_vault_file }}"

    - name: "[VaultMigrate] Keep the operator mapping"
      ansible.builtin.set_fact:
        vault_migrate_vault: "{{ vault_read_data | default({}) }}"
      no_log: true

    - name: "[VaultMigrate] Compute the keys to move and prune"
      ansible.builtin.set_fact:
        vault_migrate_moves: >-
          {%- set ns = namespace(moves={}, removed=[]) -%}
          {%- for k in vault_migrate_control_keys -%}
          {%-   set mv = vault_migrate_managed.get(k) | default('', true) -%}
          {%-   set cv = vault_migrate_vault.get(k) | default('', true) -%}
          {%-   if (mv | string | trim) | length > 0 -%}
          {%-     set ns.removed = ns.removed + [k] -%}
          {%-     if ((cv | string | trim) | length == 0) -%}
          {%-       set ns.moves = ns.moves | combine({k: mv}) -%}
          {%-     endif -%}
          {%-   endif -%}
          {%- endfor -%}
          {{ {'moves': ns.moves, 'removed': ns.removed} }}
      no_log: true

    - name: "[VaultMigrate] Report the plan"
      ansible.builtin.debug:
        msg: >-
          Move to vault.yml: {{ vault_migrate_moves.moves.keys() | list | join(', ') | default('(none)', true) }};
          remove from vault_managed.yml: {{ vault_migrate_moves.removed | join(', ') | default('(none)', true) }}

    # Never prune a key that is not guaranteed to exist in vault.yml (moved or
    # already present); guards against data loss if the move logic regresses.
    - name: "[VaultMigrate] Refuse to drop keys that would not survive"
      ansible.builtin.assert:
        that:
          - >-
            (vault_migrate_moves.removed
             | difference((vault_migrate_vault | combine(vault_migrate_moves.moves)) | list))
            | length == 0
        fail_msg: "Refusing to prune keys not written to vault.yml"
      no_log: true

    - name: "[VaultMigrate] Write the moved keys into vault.yml"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_write
      vars:
        vault_write_file: "{{ vault_migrate_vault_file }}"
        vault_write_data: "{{ vault_migrate_vault | combine(vault_migrate_moves.moves) }}"
      when: vault_migrate_moves.moves | length > 0

    - name: "[VaultMigrate] Drop the moved keys from vault_managed.yml"
      ansible.builtin.include_role:
        name: helpers
        tasks_from: vault_write
      vars:
        vault_write_file: "{{ vault_migrate_managed_file }}"
        vault_write_data: >-
          {{ vault_migrate_managed | dict2items
             | rejectattr('key', 'in', vault_migrate_moves.removed) | items2dict }}
      when: vault_migrate_moves.removed | length > 0
