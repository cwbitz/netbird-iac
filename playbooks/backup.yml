---
# ==============================================================================
# Back up the NetBird server data volume to the control node.
#
#   make backup            # -> backup/<host>/<timestamp>/
#
# Captures netbird_data.tgz: the Docker volume (store.db / idp.db / events.db +
# geo DBs), archived with the container STOPPED so the SQLite files are
# consistent.
#
# The generated encryption keys are NOT in this archive — they live on the
# control node in inventory/host_vars/<host>/vault_managed.yml, which must be
# kept separately. Losing vault_datastore_encryption_key makes the archived data
# unrecoverable. The backup contains sensitive data (user PII, hashed
# credentials) and is gitignored — never commit it.
# ==============================================================================

- name: Back up the NetBird server state
  hosts: netbird
  gather_facts: false
  vars:
    backup_dir: "{{ playbook_dir }}/../backup"
    backup_volume: "{{ netbird_data_volume | default('netbird_data') }}"
  tasks:
    - name: "[Backup] Freeze the timestamp (single value for all tasks)"
      ansible.builtin.set_fact:
        backup_stamp: "{{ lookup('pipe', 'date +%Y%m%dT%H%M%S') }}"

    - name: "[Backup] Resolve the backup path"
      ansible.builtin.set_fact:
        backup_path: "{{ backup_dir }}/{{ inventory_hostname }}/{{ backup_stamp }}"

    - name: "[Backup] Ensure the local backup directory exists"
      ansible.builtin.file:
        path: "{{ backup_path }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false

    - name: "[Backup] Stop the server container for a consistent snapshot"
      community.docker.docker_container:
        name: netbird-server
        state: stopped

    - name: "[Backup] Archive the data volume"
      ansible.builtin.command: >-
        docker run --rm
        -v {{ backup_volume }}:/data:ro
        -v /tmp:/backup
        alpine sh -c "cd /data && tar czf /backup/netbird_data.tgz ."
      changed_when: true

    - name: "[Backup] Start the server container"
      community.docker.docker_container:
        name: netbird-server
        state: started

    - name: "[Backup] Fetch the archive to the control node"
      ansible.builtin.fetch:
        src: /tmp/netbird_data.tgz
        dest: "{{ backup_path }}/"
        flat: true

    - name: "[Backup] Remove the remote archive"
      ansible.builtin.file:
        path: /tmp/netbird_data.tgz
        state: absent

    - name: "[Backup] Report"
      ansible.builtin.debug:
        msg: >-
          Backup written to {{ backup_path }}/netbird_data.tgz. The encryption
          key is NOT in this archive: it stays in the control node's
          inventory/host_vars/{{ inventory_hostname }}/vault_managed.yml, which
          must be kept to restore. Keep a copy off-host.
