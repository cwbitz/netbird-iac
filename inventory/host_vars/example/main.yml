---
# ==============================================================================
# Per-host configuration template (inventory/host_vars/example/main.yml)
# ==============================================================================
# Copy to inventory/host_vars/<hostname>/main.yml for each host. Only example/ is
# committed; real <hostname>/ directories are gitignored.
#
# This is the per-host file you maintain. Put secrets/PII in the sibling
# vault.yml; the role writes runtime secrets to the sibling vault_managed.yml.

# --- Topology ----------------------------------------------------------------
# ansible_host comes from hosts.yml; the port from vault_host in vault.yml.
host_ssh_port: "{{ vault_host.port | default(22) }}"

# --- SSH connection identity -------------------------------------------------
# `host-bootstrap` probes [ansible, admin, root] and uses the first that works;
# normal runs always use `ansible`. Each identity may set a password and/or a
# private key file (SSH tries the key first, then the password).
#
# `pubkey` is an optional control-node path to the matching public key; when set,
# `host-bootstrap` authorizes it for that account. Empty is ignored (keys are
# never auto-generated). Only paths, never raw strings.
host_ssh_identities:
  root:
    user: "root"
    password: "{{ vault_root_password | default('', true) }}"
    privkey: "{{ vault_root_ssh_privkey_file | default('', true) }}"
    pubkey: "{{ vault_root_ssh_pubkey_file | default('', true) }}"
    become: false
  admin:
    user: "{{ vault_admin_user | default('admin') }}"
    password: "{{ vault_admin_password | default('', true) }}"
    privkey: "{{ vault_admin_ssh_privkey_file | default('', true) }}"
    pubkey: "{{ vault_admin_ssh_pubkey_file | default('', true) }}"
    become: true
  ansible:
    user: "{{ vault_ansible_user | default('ansible') }}"
    password: "{{ vault_ansible_password | default('', true) }}"
    privkey: "{{ vault_ansible_ssh_privkey_file | default('', true) }}"
    pubkey: "{{ vault_ansible_ssh_pubkey_file | default('', true) }}"
    become: true

host_ssh_identity: "{{ host_ssh_identities['ansible'] }}"
host_ssh_user: "{{ host_ssh_identity.user }}"
host_ssh_password: "{{ host_ssh_identity.password }}"
host_ssh_privkey_file: "{{ host_ssh_identity.privkey }}"
host_ssh_become: "{{ host_ssh_identity.become }}"
# Prefer key, then password, at the SSH layer (single password prompt max).
host_ssh_common_args: "-o PreferredAuthentications=publickey,password -o NumberOfPasswordPrompts=1"

# Ansible connection-plugin interface (sourced from host_ssh_*).
ansible_port: "{{ host_ssh_port }}"
ansible_user: "{{ host_ssh_user }}"
ansible_password: "{{ host_ssh_password }}"
ansible_ssh_private_key_file: "{{ host_ssh_privkey_file }}"
ansible_become: "{{ host_ssh_become }}"
ansible_ssh_common_args: "{{ host_ssh_common_args }}"

# --- Public endpoint (aliases over vault) ------------------------------------
# The FQDN the server is reachable at; its A record must point at this host and
# ports 80/443 TCP + 3478 UDP must be open. Used as the OIDC issuer, the
# dashboard host and the TLS certificate subject.
domain_name: "{{ vault_domain_name }}"
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# --- Optional first-owner bootstrap ------------------------------------------
# When owner_email is set the role creates the first owner via /api/setup (only
# works while the instance has no accounts). If owner_password is empty one is
# generated into vault_managed.yml. Leave the email empty to onboard manually at
# https://<domain>/setup (a password without an email is ignored with a warning).
#
# On that first setup the role also bootstraps tenant automation: it creates an
# 'admin' service user and a PAT for it, and persists that token as
# vault_admin_service_user_access_token in vault_managed.yml.
owner_email: "{{ vault_owner_email | default('', true) }}"
owner_name: "{{ vault_owner_name | default('', true) }}"
owner_password: "{{ vault_owner_password | default('', true) }}"

# [OPTIONAL] Skip the startup GeoLite2 download (needs outbound access to
# pkgs.netbird.io; set true on air-gapped/slow-CDN hosts — see AGENTS.md).
# disable_geolite_update: true

# --- Optional host bootstrap (make host-bootstrap) ---------------------------
# Region-specific mirrors for hosts where the defaults are slow/blocked (e.g.
# China-based VPS). This playbook is opt-in and NOT part of make deploy.
# Debian-family APT mirror (security mirror derived automatically; override
# with host_apt_security_mirror if your mirror doesn't follow the pattern):
# host_apt_mirror: "https://mirrors.tuna.tsinghua.edu.cn/debian"
# Docker Hub registry mirrors (tried in order):
# docker_registry_mirrors:
#   - "https://docker.1ms.run"
# make host-bootstrap probes [ansible, admin, root] and creates the 'ansible'
# service account when not already connected as it. Each configured
# vault_<id>_ssh_pubkey_file is authorized for its account; unset is ignored. The
# ansible pubkey switches the account to key auth, otherwise a password is set
# (host_bootstrap_password, else generated into the encrypted vault). Private key
# paths go in vault.yml (vault_<id>_ssh_privkey_file).

# ==============================================================================
# Tenant configuration (playbooks/tenant.yml)
# ==============================================================================
# Desired state for the NetBird account (users, groups, policies, networks,
# DNS, account settings, ...), applied against the running server's REST API via
# community.ansible_netbird. Define non-secret values here, secret/PII in
# vault.yml; the play renders them into .ansible_cache/tenant_config/<host>/.
#
# Preview by default: `make plan`; apply with `make apply`. Strict mode (remove
# unmanaged resources) is off unless `tenant_strict: true` is set here (per host)
# or passed with -e; absent, empty, or `false` all mean non-strict. Unset
# variables are left untouched unless strict mode removes unmanaged resources.
#
# --- Account settings (settings.yml) -----------------------------------------
# Account-wide settings (API /api/accounts). Each option is shown with its
# default; uncomment to change. Group lists accept plain names (resolved to IDs).
# ENTERPRISE-gated options are marked.
# netbird_settings:
#   # Authentication
#   peer_login_expiration_enabled: true        # require periodic SSO re-auth (setup-key peers exempt)
#   peer_login_expiration: 604800              # 7 days (seconds)
#   peer_inactivity_expiration_enabled: false
#   peer_inactivity_expiration: 2592000        # 30 days (only used when enabled)
#   extra_user_approval_required: false        # approve users auto-joining by email domain
#   # extra_peer_approval_enabled: false       # ENTERPRISE
#   # Permissions
#   regular_users_view_blocked: false
#   # User groups
#   groups_propagation_enabled: true
#   jwt_groups_enabled: false
#   jwt_groups_claim_name: "groups"
#   jwt_allow_groups: []
#   # Networks
#   dns_domain: "netbird.selfhosted"           # keep a non-public domain
#   network_range: "100.64.0.0/10"             # changing re-allocates all peer IPs
#   network_range_v6: "fd00::/64"
#   ipv6_enabled_groups: []                    # empty = disable IPv6 overlay
#   routing_peer_dns_resolution_enabled: true
#   # extra_network_traffic_logs_enabled: false
#   # extra_network_traffic_logs_groups: []
#   # extra_network_traffic_packet_counter_enabled: false  # ENTERPRISE
#   # Clients
#   lazy_connection_enabled: false
#   auto_update_version: "disabled"            # disabled | latest | a version
#   auto_update_always: false
#   peer_expose_enabled: false
#   peer_expose_groups: []
#
# --- Groups (access_control/groups.yml) --------------------------------------
# Do NOT list the auto-managed "All" group.
# netbird_groups:
#   - name: "personal"
#   - name: "guests"
#
# --- Policies / ACL (access_control/policies.yml) ----------------------------
# netbird_policies:
#   - name: "personal-to-guests"
#     description: "Let the owner reach guest machines over SSH"
#     enabled: true
#     rules:
#       - name: "ssh"
#         enabled: true
#         sources: ["personal"]
#         destinations: ["guests"]
#         bidirectional: false
#         protocol: "tcp"
#         ports: ["22"]
#         action: "accept"
#     state: present
#
# --- Posture checks (access_control/posture_checks.yml) ----------------------
# netbird_posture_checks: []
#
# --- Networks (networks.yml) -------------------------------------------------
# A routed network binds its gateway by peer GROUP (routers[].peer_groups), not
# by an individual peer name. Declare the group (netbird_groups) and have the
# client's setup key auto-assign it, so the network can be created on the first
# run and the enrolling client becomes its routing peer automatically.
# netbird_networks: []
#
# --- DNS (dns/nameservers.yml, dns/zones.yml, dns/settings.yml) --------------
# netbird_dns_nameserver_groups: []
# netbird_dns_zones: []
# netbird_dns_disabled_management_groups: []
#
# --- Setup keys (setup_keys.yml) ---------------------------------------------
# The secret is returned only at creation; after `apply` it is persisted
# to vault_managed.yml as vault_setup_key_<name> (non-alphanumerics -> '_').
# expires_in is seconds, 1..31536000 (1 year max). A never-expiring key
# (expires_in: 0) is not expressible here; create it once via the API instead.
# netbird_setup_keys: []
#   - name: "server-enrollment"
#     key_type: "reusable"          # one-off | reusable
#     expires_in: 31536000          # seconds, 1..31536000 (1 year max)
#     auto_groups: ["servers"]
#     usage_limit: 0                # 0 = unlimited
#     ephemeral: false
#     state: present
#
# --- Services (services.yml) -------------------------------------------------
# Services and custom domains need a registered proxy cluster, which only the
# self-hosted proxy software itself can create (BYOP); the collection can delete
# a cluster (netbird_proxy_cluster, state=absent) but not create one.
# netbird_services: []
# netbird_service_domains: []
#
# --- Users / service users (applied directly, not via a config file) ---------
# Local-user passwords are generated and returned once (not persisted); prefer
# invites, and put emails in vault.yml if they are sensitive. auto_groups take
# plain names (resolved to IDs before the API call). IdP-driven provisioning
# (SCIM/IdP sync) is Enterprise; manual users are Community.
# netbird_users:
#   - email: "alice@example.com"
#     name: "Alice"
#     role: "user"            # owner | admin | user
#     auto_groups: ["personal"]
#     state: present
# netbird_service_users:
#   - name: "automation"
#     role: "admin"
#     auto_groups: []
#     state: present
