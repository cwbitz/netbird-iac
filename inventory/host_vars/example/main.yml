---
# ==============================================================================
# Per-host configuration template (inventory/host_vars/example/main.yml)
# ==============================================================================
# Copy this to inventory/host_vars/<hostname>/main.yml for every host you manage
# (one directory per host). This example/ folder is the only committed content
# under host_vars/; every real <hostname>/ directory is gitignored.
#
# THE single per-host variable file the user maintains. Real secrets stay in the
# encrypted vault.yml next to this file; automation-managed secrets are written to
# the encrypted vault_managed.yml next to it.

# --- Topology ----------------------------------------------------------------
# ansible_host comes from hosts.yml; the port comes from the per-host topology
# map in vault.yml (flat: vault_host = {ip, port}).
host_ssh_port: "{{ vault_host.port | default(22) }}"

# --- SSH connection identity -------------------------------------------------
# `host-bootstrap` probes [ansible, admin, root] and uses the first that works.
# Normal runs (site/tenant/backup) always use `ansible`. For each identity you
# may provide a password AND/OR a private key; when both are set SSH tries the
# key first, then falls back to the password.
#
# `pubkey` is an optional control-node path to the matching public key. When set,
# `host-bootstrap` authorizes it for that account on the target host; when empty
# it is ignored (keys are never auto-generated). Only paths, never raw strings.
host_ssh_identities:
  root:
    user: "{{ vault_root_user | default('root') }}"
    password: "{{ vault_root_password | default('') }}"
    privkey: "{{ vault_root_ssh_privkey_file | default('') }}"
    pubkey: "{{ vault_root_ssh_pubkey_file | default('') }}"
    become: false
  admin:
    user: "{{ vault_admin_user | default('admin') }}"
    password: "{{ vault_admin_password | default('') }}"
    privkey: "{{ vault_admin_ssh_privkey_file | default('') }}"
    pubkey: "{{ vault_admin_ssh_pubkey_file | default('') }}"
    become: true
  ansible:
    user: "{{ vault_ansible_user | default('ansible') }}"
    password: "{{ vault_ansible_password | default('') }}"
    privkey: "{{ vault_ansible_ssh_privkey_file | default('') }}"
    pubkey: "{{ vault_ansible_ssh_pubkey_file | default('') }}"
    become: true

host_ssh_identity: "{{ host_ssh_identities['ansible'] }}"
host_ssh_user: "{{ host_ssh_identity.user }}"
host_ssh_password: "{{ host_ssh_identity.password }}"
host_ssh_privkey_file: "{{ host_ssh_identity.privkey }}"
host_ssh_become: "{{ host_ssh_identity.become }}"
# Prefer key, then password, at the SSH layer (single password prompt max).
host_ssh_common_args: "-o PreferredAuthentications=publickey,password -o NumberOfPasswordPrompts=1"

# Ansible connection-plugin interface (fixed names; sourced from host_ssh_*).
ansible_port: "{{ host_ssh_port }}"
ansible_user: "{{ host_ssh_user }}"
ansible_password: "{{ host_ssh_password }}"
ansible_ssh_private_key_file: "{{ host_ssh_privkey_file }}"
ansible_become: "{{ host_ssh_become }}"
ansible_ssh_common_args: "{{ host_ssh_common_args }}"

# --- Public endpoint (aliases over vault) ------------------------------------
# The FQDN the server is reachable at; its A record must point at this host and
# ports 80/443 TCP + 3478 UDP must be open. Used as the OIDC issuer, the
# dashboard host and the TLS certificate subject.
domain_name: "{{ vault_domain_name }}"
letsencrypt_email: "{{ vault_letsencrypt_email }}"

# --- Optional first-owner bootstrap ------------------------------------------
# When owner_email is set the role creates the first owner through the
# unauthenticated /api/setup endpoint (only works while the instance has no
# accounts). If owner_password is also set it is used; if it is empty a
# password is generated into the encrypted vault_managed.yml. Leave the email
# empty to onboard manually at https://<domain>/setup (a password set without an
# email is not applied and produces a warning).
#
# On that first setup the role also bootstraps the tenant automation credential
# (fixed behaviour, no switch): it asks /api/setup for a short-lived owner access
# token, creates an 'admin' service user and a Personal Access Token for it,
# persists that token as vault_admin_service_user_access_token in
# vault_managed.yml, then deletes the owner access token again.
owner_email: "{{ vault_owner_email | default('') }}"
owner_name: "{{ vault_owner_name | default('') }}"
owner_password: "{{ vault_owner_password | default('') }}"

# [OPTIONAL] Skip the startup GeoLite2 download (needs outbound access to
# pkgs.netbird.io; set true on air-gapped/slow-CDN hosts — see AGENTS.md).
# disable_geolite_update: true

# --- Optional host bootstrap (make host-bootstrap) ---------------------------
# Region-specific mirrors for hosts where the defaults are slow/blocked (e.g.
# China-based VPS). This playbook is opt-in and NOT part of make ans-site.
# Debian-family APT mirror (security mirror derived automatically; override
# with host_apt_security_mirror if your mirror doesn't follow the pattern):
# host_apt_mirror: "https://mirrors.tuna.tsinghua.edu.cn/debian"
# Docker Hub registry mirrors (tried in order):
# docker_registry_mirrors:
#   - "https://docker.1ms.run"
# make host-bootstrap probes [ansible, admin, root] and creates the 'ansible'
# service account when not already connected as it. For every identity whose
# vault_<id>_ssh_pubkey_file is set, the public key at that path is authorized
# for the matching account (unset -> ignored, never generated). The ansible
# pubkey also switches the service account to key auth; otherwise a password is
# set (host_bootstrap_password, else generated into the encrypted vault). The
# matching private key path is set explicitly in the same vault
# (vault_<id>_ssh_privkey_file). Only paths are accepted, never raw key strings.

# ==============================================================================
# Tenant configuration (playbooks/tenant.yml)
# ==============================================================================
# Desired state for the NetBird account (users, groups, policies, networks,
# DNS, account settings, ...), applied against the running server's REST API.
# Define values here (non-secret) or in vault.yml (secret/PII); the play
# renders them into .ansible_cache/tenant_config/<host>/ and applies them with
# the community.ansible_netbird collection (plain names -> IDs).
#
# PREVIEW by default: `make netbird-plan`; apply with `make netbird-apply`
# (+ `make netbird-apply-strict` to remove unmanaged resources).
#
# Unset variables are treated as empty: in the default non-strict mode those
# resource types are left untouched; strict mode may remove unmanaged ones.
#
# --- Account settings (settings.yml) -----------------------------------------
# Account-wide settings (API /api/accounts). Every option is shown with its
# default; uncomment and adjust as needed. Group-list options accept plain group
# names (resolved to IDs by the collection). Enterprise-gated options are marked.
# netbird_settings:
#   # Authentication
#   peer_login_expiration_enabled: true        # require periodic SSO re-auth (setup-key peers exempt)
#   peer_login_expiration: 604800              # 7 days (seconds)
#   peer_inactivity_expiration_enabled: false
#   peer_inactivity_expiration: 2592000        # 30 days (only used when enabled)
#   extra_user_approval_required: false        # approve users auto-joining by email domain
#   # extra_peer_approval_enabled: false       # ENTERPRISE
#   # Permissions
#   regular_users_view_blocked: false
#   # User groups
#   groups_propagation_enabled: true
#   jwt_groups_enabled: false
#   jwt_groups_claim_name: "groups"
#   jwt_allow_groups: []
#   # Networks
#   dns_domain: "netbird.selfhosted"           # keep a non-public domain
#   network_range: "100.64.0.0/10"             # changing re-allocates all peer IPs
#   network_range_v6: "fd00::/64"
#   ipv6_enabled_groups: []                    # empty = disable IPv6 overlay
#   routing_peer_dns_resolution_enabled: true
#   # extra_network_traffic_logs_enabled: false
#   # extra_network_traffic_logs_groups: []
#   # extra_network_traffic_packet_counter_enabled: false  # ENTERPRISE
#   # Clients
#   lazy_connection_enabled: false
#   auto_update_version: "disabled"            # disabled | latest | a version
#   auto_update_always: false
#   peer_expose_enabled: false
#   peer_expose_groups: []
#
# --- Groups (access_control/groups.yml) --------------------------------------
# Do NOT list the auto-managed "All" group.
# netbird_groups:
#   - name: "personal"
#   - name: "guests"
#
# --- Policies / ACL (access_control/policies.yml) ----------------------------
# netbird_policies:
#   - name: "personal-to-guests"
#     description: "Let the owner reach guest machines over SSH"
#     enabled: true
#     rules:
#       - name: "ssh"
#         enabled: true
#         sources: ["personal"]
#         destinations: ["guests"]
#         bidirectional: false
#         protocol: "tcp"
#         ports: ["22"]
#         action: "accept"
#     state: present
#
# --- Posture checks (access_control/posture_checks.yml) ----------------------
# netbird_posture_checks: []
#
# --- Networks (networks.yml) -------------------------------------------------
# netbird_networks: []
#
# --- DNS (dns/nameservers.yml, dns/zones.yml, dns/settings.yml) --------------
# netbird_dns_nameserver_groups: []
# netbird_dns_zones: []
# netbird_dns_disabled_management_groups: []
#
# --- Setup keys (setup_keys.yml) ---------------------------------------------
# The secret value is returned by the API only at creation. After a successful
# `netbird-apply` the play persists each newly created key into the encrypted
# vault_managed.yml as `vault_setup_key_<name>` (non-alphanumerics -> '_'), so
# read it there instead of recreating the key.
# Expiry: `expires_in` is seconds and must be > 0 (the collection preflight
# rejects 0), with a maximum of 31536000 (1 year). A never-expiring key (the API
# accepts expires_in: 0) is NOT expressible here; create it once via the API or
# the community.ansible_netbird.netbird_setup_key module if you need one.
# netbird_setup_keys: []
#   - name: "server-enrollment"
#     key_type: "reusable"          # one-off | reusable
#     expires_in: 31536000          # seconds, 1..31536000 (1 year max)
#     auto_groups: ["servers"]
#     usage_limit: 0                # 0 = unlimited
#     ephemeral: false
#     state: present
#
# --- Services (services.yml) -------------------------------------------------
# Services and custom domains need a registered reverse-proxy cluster. The
# cluster is created by the self-hosted proxy software itself (BYOP): deploy it
# and it registers automatically. The collection only deletes clusters
# (netbird_proxy_cluster, state=absent) -- it cannot create them.
# netbird_services: []
# netbird_service_domains: []
#
# --- Agent Network (agent_network.yml) ---------------------------------------
# Agent Network is the keyless AI-gateway access layer (open source, self-hosted,
# beta). It is a SEPARATE self-hosted deployment (not the management container):
# see https://docs.netbird.io/agent-network/quickstart. Edition notes:
#   Community (free/AGPLv3): providers, guardrails, policies, budget/token
#     limits, settings, SSO/MFA, usage and access logs.
#   Enterprise (commercial license): SCIM/IdP auto-sync, audit/access-log
#     streaming to SIEM, MDM/EDR device controls, HA, MSP/multi-tenant.
# On an account that never bootstrapped agent-network, the settings module fails
# with "Agent-network settings have not been bootstrapped" because the
# collection's configure role does not pass the required proxy_address /
# endpoint. Bootstrap once out-of-band, or leave netbird_an_settings unset.
# Providers also need a real upstream credential (validated at creation time).
# netbird_an_settings: {}
# netbird_an_providers: []
# netbird_an_guardrails: []
# netbird_an_policies: []
# netbird_an_budget_rules: []
#
# --- Users / service users (applied directly, not via a config file) ---------
# Local-user passwords are generated and returned only once (not persisted);
# prefer invites, or put this in vault.yml if the emails are sensitive.
# auto_groups take plain group names (resolved to IDs before the API call).
# NOTE: automatic user/group provisioning from an IdP (SCIM/IdP sync) is an
# Enterprise/Cloud feature; on Community you invite users and assign groups
# manually (as below). Manual local users are Community.
# netbird_users:
#   - email: "alice@example.com"
#     name: "Alice"
#     role: "user"            # owner | admin | user
#     auto_groups: ["personal"]
#     state: present
# netbird_service_users:
#   - name: "automation"
#     role: "admin"
#     auto_groups: []
#     state: present
