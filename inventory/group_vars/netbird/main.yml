---
# ==============================================================================
# Shared group defaults for the NetBird server hosts
# (inventory/group_vars/netbird/main.yml)
# ==============================================================================
# Per-host overrides go in inventory/host_vars/<hostname>/main.yml; image and
# behaviour defaults live in roles/netbird_server/defaults/main.yml.

# Target-host directory holding the rendered stack (docker-compose.yml,
# config.yaml, dashboard.env).
stack_dir: "/opt/netbird"

# Install Docker Engine + the Compose v2 plugin from Docker's official apt
# repository when missing (Debian-family). Set false to require a preinstalled
# Docker; the preflight then fails with install guidance.
install_docker: true
