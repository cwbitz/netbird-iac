[defaults]
# Asset, role, and encryption path definitions
inventory               = ./inventory/hosts.yml
roles_path              = ./roles
vault_password_file     = ~/.config/projects/netbird-iac/ansible_vault_password

# Connectivity and security policies
host_key_checking       = True
remote_user             = root
timeout                 = 30

# Performance and concurrency tuning
forks                   = 10
retry_files_enabled     = False

# Fact gathering and persistent caching
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = ./.ansible_cache
fact_caching_timeout    = 86400

# Terminal output formatting and display options
stdout_callback         = default
result_format           = yaml
callbacks_enabled       = timer, profile_tasks
nocows                  = True

# Python interpreter discovery and warning suppression
interpreter_python      = auto_silent

[privilege_escalation]
become                  = False
become_method           = sudo
become_user             = root
become_ask_pass         = False

[ssh_connection]
# SSH Pipelining acceleration
pipelining              = True

# SSH multiplexing and connection persistence
ssh_args                = -o ControlMaster=auto -o ControlPersist=60s
control_path_dir        = ~/.ansible/cp
retries                 = 3

[inventory]
# Fail early if inventory format cannot be parsed
unparsed_is_failed      = True
