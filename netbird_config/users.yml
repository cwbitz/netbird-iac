# ==============================================================================
# Users and service users (desired state).
# This file is NOT part of the collection's Config-as-Code skeleton; it is
# applied by playbooks/tenant.yml via the netbird_user module (run AFTER groups
# exist, and only when netbird_tenant_commit=true).
#
# Notes:
# - With the embedded Dex IdP, a newly created user's password is generated and
#   returned only once (not persisted here). Prefer invites for humans, or set
#   vault_owner_* and onboard from the Dashboard.
# - Service users are for automation (API tokens).
# Reference: https://docs.netbird.io/api/resources/users
# ==============================================================================
netbird_users: []
  # - email: "alice@example.com"
  #   name: "Alice"
  #   role: "user"                 # owner, admin, user
  #   auto_groups:
  #     - personal
  #   state: present

netbird_service_users: []
  # - name: "automation"
  #   role: "admin"
  #   auto_groups: []
  #   state: present
