---
# ==============================================================================
# Access policies (desired state). Matches Dashboard: Access Control > Policies.
# Use plain group and posture-check names; the collection resolves them to IDs.
# Reference: https://docs.netbird.io/api/resources/policies
# ==============================================================================
# Example: allow the "personal" group to reach the "guests" group on SSH only.
netbird_policies:
  - name: "personal-to-guests"
    description: "Let the owner reach guest machines over SSH"
    enabled: true
    rules:
      - name: "ssh"
        enabled: true
        sources:
          - personal
        destinations:
          - guests
        bidirectional: false
        protocol: "tcp"
        ports: ["22"]
        action: "accept"
    state: present
